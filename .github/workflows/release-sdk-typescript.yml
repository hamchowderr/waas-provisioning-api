# Publishes sdk/typescript to npm as waas-provisioning-sdk when a tag like sdk-ts-v0.1.0 is pushed.
# Uses npm Trusted Publishing (GitHub's OIDC token), so no npm token is stored. Steps for maintainers: docs/publishing.md.
name: Release TypeScript SDK

on:
  push:
    tags: ['sdk-ts-v*']

permissions:
  contents: read
  id-token: write # npm Trusted Publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches package.json
        working-directory: sdk/typescript
        run: |
          expected="sdk-ts-v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json (expected $expected)"
            exit 1
          fi
      # Trusted Publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run sdk:check
      - name: Publish
        working-directory: sdk/typescript
        run: npm publish --provenance --access public
