name: Fetch FluentCart Migrator (temporary)
on:
  push:
    branches: [claude/project-thread-aku4cc]
    paths: [.github/workflows/fetch-migrator.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/project-thread-aku4cc
      - name: Download and commit the add-on zip
        run: |
          set -euo pipefail
          curl -fsSL https://addons-cdn.fluentcart.com/fluent-cart-migrator.zip -o /tmp/m.zip
          unzip -l /tmp/m.zip | head -20
          unzip -p /tmp/m.zip fluent-cart-migrator/fluent-cart-migrator.php | head -30
          V=$(unzip -p /tmp/m.zip fluent-cart-migrator/fluent-cart-migrator.php | sed -n 's/^[ *]*Version:[ ]*//p' | head -1 | tr -d '\r ')
          echo "version=$V"
          cp /tmp/m.zip "templates/anypress-store/plugins/fluent-cart-migrator-$V.zip"
          sha256sum "templates/anypress-store/plugins/fluent-cart-migrator-$V.zip"
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add templates/anypress-store/plugins
          git rm -q .github/workflows/fetch-migrator.yml
          git commit -m "Store template: FluentCart Migrator $V zip from addons-cdn.fluentcart.com"
          git push origin HEAD:claude/project-thread-aku4cc
