name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # ubuntu-latest moved to 26.04 (Oct 2026): its pg_dump 17+ writes dumps postgres:16 can't restore
    # and its PHP ICU rejects the und_XX locale the owner mu-plugin test uses. Pinned until both are moved.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The n8n node and the Zapier app (integrations/) are driven against the app by test/integrations.test.ts.
      - name: n8n node
        working-directory: integrations/n8n
        run: npm ci && npm run lint && npm run build
      - name: Zapier app
        working-directory: integrations/zapier
        run: npm ci && npm run validate
      - run: npm run typecheck
      - run: npm run sdk:check
      - run: npm test
