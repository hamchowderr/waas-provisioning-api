name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # ubuntu-latest moved to 26.04 (Oct 2026): its pg_dump 17+ writes dumps postgres:16 can't restore
    # and its PHP ICU rejects the und_XX locale the owner mu-plugin test uses. Pinned until both are moved.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The n8n node and the Zapier app (integrations/) are driven against the app by test/integrations.test.ts.
      - name: n8n node
        working-directory: integrations/n8n
        run: npm ci && npm run lint && npm run build
      - name: Zapier app
        working-directory: integrations/zapier
        run: npm ci && npm run validate
      - run: npm run typecheck
      - run: npm run sdk:check
      - run: npm test
      # The website assistant (agent/) is its own package; its tests run it against the API above.
      - name: Website assistant
        working-directory: agent
        run: npm ci && npm run typecheck && npm test
      - name: Website assistant chat panel
        working-directory: agent/panel
        run: npm ci && npx tsc --noEmit && npm run build
      - name: Chat panel in a browser
        working-directory: agent
        run: npx playwright install --with-deps chromium && npm run test:browser

  assistant-playground:
    # The website assistant on a real WordPress: WordPress Playground running WaaS Client from waas-plugins.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waas_test
      WAAS_CLIENT_DIR: ${{ github.workspace }}/waas-plugins/packages/waas-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hamchowderr/waas-plugins
          path: waas-plugins
      - uses: actions/setup-node@v4
        with:
          # Playground's CLI needs Node 24.18 or newer.
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agent/package-lock.json
      - run: npm ci
      - name: WaaS Client
        working-directory: waas-plugins/packages/waas-client
        run: composer install --no-dev --no-interaction --prefer-dist
      - name: Website assistant on Playground
        working-directory: agent
        run: npm ci && npm run test:playground

  imports-docker:
    # Moves sites into real MariaDB and WordPress containers (test/docker). Separate from `test` so that job stays fast.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:docker
