name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The Update pins workflow starts CI on its pull request's branch this way.
  workflow_dispatch:

jobs:
  pins:
    # Fails when a pinned version (.github/pins.json) is behind an AnyPress release; warns for third-party pins.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/pins

  test:
    # ubuntu-latest moved to 26.04 (Oct 2026): its PHP ICU rejects the und_XX locale the owner
    # mu-plugin test uses. Pinned until that test is moved; pg_dump 18 comes from PGDG below.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waas_test
    steps:
      - uses: actions/checkout@v7
      - name: pg_dump 18 (the database backup tests dump the postgres:18 service)
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          # The runner's own Postgres 16 would win the pg_wrapper choice; put 18 first.
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version | grep -q ' 18\.'
      - uses: actions/setup-node@v7
        with:
          # The Node line the API's Docker image runs (the active LTS).
          node-version: 26
          cache: npm
      - run: npm ci
      # The n8n node and the Zapier app (integrations/) are driven against the app by test/integrations.test.ts.
      - name: n8n node
        working-directory: integrations/n8n
        run: npm ci && npm run lint && npm run build
      - name: Zapier app
        working-directory: integrations/zapier
        run: npm ci && npm run validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run sdk:check
      - run: npm test
      # The website assistant (agent/) is its own package; its tests run it against the API above.
      - name: Website assistant
        working-directory: agent
        run: npm ci && npm run typecheck && npm test
      - name: Phone receptionist
        working-directory: voice
        run: npm ci && npm run typecheck && npm test
      - name: Website assistant chat panel
        working-directory: agent/panel
        run: npm ci && npx tsc --noEmit && npm run build
      - name: Chat panel in a browser
        working-directory: agent
        run: npx playwright install --with-deps chromium && npm run test:browser

  assistant-playground:
    # The website assistant on a real WordPress: WordPress Playground running AnyPress Client from waas-plugins.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waas_test
      ANYPRESS_CLIENT_DIR: ${{ github.workspace }}/waas-plugins/packages/anypress-client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: hamchowderr/waas-plugins
          path: waas-plugins
      - uses: actions/setup-node@v7
        with:
          # Playground's CLI needs Node 24.18 or newer.
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agent/package-lock.json
      - run: npm ci
      - name: AnyPress Client
        working-directory: waas-plugins/packages/anypress-client
        run: composer install --no-dev --no-interaction --prefer-dist
      - name: Website assistant on Playground
        working-directory: agent
        run: npm ci && npm run test:playground

  imports-docker:
    # Moves sites into real MariaDB and WordPress containers (test/docker). Separate from `test` so that job stays fast.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run test:docker

  fallow:
    # Fallow: unused files, exports, types and packages fail on every run (.fallowrc.json). On a pull request,
    # `fallow audit` also fails on duplicated or overly complex code the change adds; what is already there is listed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unused code
        run: npm run deadcode
      - name: New duplication and complexity
        if: github.event_name == 'pull_request'
        run: npx fallow audit --base origin/${{ github.base_ref }}
