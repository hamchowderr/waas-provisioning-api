# Builds the store template and the ready-made storefront template (templates/release.sh) and attaches
# them, with their checksums, to a GitHub release templates-v<version>. install/anypress-install.sh publishes
# the newest one on a new server, and the next release on its next run.
name: Release templates

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, e.g. 1.0.13 (the tag is templates-v<version>)
        required: true
      plugins_ref:
        description: waas-plugins branch or tag WaaS Client comes from
        default: main
      host_version:
        description: WaaS Host version for the storefront. Empty, the newest waas-host release
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VERSION: ${{ inputs.version }}
      HOST_VERSION: ${{ inputs.host_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hamchowderr/waas-plugins
          ref: ${{ inputs.plugins_ref }}
          path: waas-plugins
          fetch-depth: 0
      - name: Check the version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must look like 1.0.13"; exit 1; }
          if gh release view "templates-v$VERSION" >/dev/null 2>&1; then echo "templates-v$VERSION already exists"; exit 1; fi
          if [ -z "$HOST_VERSION" ]; then
            # Pre-releases sort before their release (2.3.0-beta.16 < 2.3.0).
            HOST_VERSION=$(git -C waas-plugins -c versionsort.suffix=- tag -l 'waas-host-v*' --sort=-v:refname | head -1 | sed 's/^waas-host-v//')
            echo "HOST_VERSION=$HOST_VERSION" >> "$GITHUB_ENV"
          fi
          echo "WaaS Host $HOST_VERSION"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build
        run: templates/release.sh "$PWD/waas-plugins" "$HOST_VERSION" "$VERSION" out
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The store template and the ready-made storefront template. A new install publishes the newest release; run the installer again to publish this one."
            echo
            echo "- anypress-store.zip: WaaS Client from waas-plugins $(git -C waas-plugins rev-parse --short HEAD), $(unzip -p out/anypress-store.zip waas-template.json | jq -r '"WordPress \(.wordPress), " + (.plugins | to_entries | map("\(.key) \(.value)") | join(", "))')"
            echo "- agency-storefront.zip: $(unzip -p out/agency-storefront.zip waas-template.json | jq -r '"WordPress \(.wordPress), " + (.plugins | to_entries | map("\(.key) \(.value)") | join(", "))')"
          } > notes.md
          gh release create "templates-v$VERSION" out/anypress-store.zip out/agency-storefront.zip out/version.txt out/SHA256SUMS \
            --target "$GITHUB_SHA" --title "Templates $VERSION" --notes-file notes.md --latest=false
