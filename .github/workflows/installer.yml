# Runs install/anypress-install.sh on a fresh GitHub runner the way the Hostinger front door does (its
# post-install script, made against a stand-in for Hostinger's API; the Hetzner and DigitalOcean front doors
# are checked to hand their servers the same script): Coolify, the API (built from this branch),
# Postgres, DNS records (against a stand-in for Cloudflare's API), the dashboard, the store templates (built from this branch, into an S3 server on the runner)
# and the storefront, then the installer a second time to check it changes nothing, then its own check.
# DNS and certificates can't be tested here: the test domains don't exist.
name: Installer

on:
  pull_request:
    paths: ['install/**', 'templates/release.sh', 'templates/anypress-store/**', 'templates/agency-storefront/**', '.github/workflows/installer.yml']
  workflow_dispatch:
    inputs:
      release:
        description: Publish the newest templates-v* release instead of templates built from this branch
        type: boolean
        default: false

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: |
          shellcheck -S warning install/anypress-install.sh templates/release.sh
          python3 -m py_compile install/test/*.py
      - uses: actions/checkout@v4
        if: ${{ !inputs.release }}
        with:
          repository: hamchowderr/waas-plugins
          path: waas-plugins
          fetch-depth: 0
      - name: Templates (what a templates-v* release carries)
        if: ${{ !inputs.release }}
        run: |
          host=$(git -C waas-plugins -c versionsort.suffix=- tag -l 'waas-host-v*' --sort=-v:refname | head -1 | sed 's/^waas-host-v//')
          templates/release.sh "$PWD/waas-plugins" "$host" 0.0.0 /tmp/templates
      - name: Bucket (an S3 server on this runner, at an address the stores reach too)
        run: |
          python3 -m venv /tmp/s3 && /tmp/s3/bin/pip install -q 'moto[server]'
          nohup /tmp/s3/bin/moto_server -H 0.0.0.0 -p 9000 > /tmp/s3.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf -X PUT http://127.0.0.1:9000/anypress-ci -o /dev/null && break; sleep 2; done
          echo "S3_HOST=$(hostname -I | awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Cloudflare (a stand-in for its DNS API)
        run: nohup python3 install/test/cloudflare-mock.py 9100 anypress-ci.test anypress-ci-sites.test > /tmp/cloudflare.log 2>&1 &
      - name: Hostinger (a stand-in for its VPS API)
        run: nohup python3 install/test/hostinger-mock.py 9200 /tmp/post_install > /tmp/hostinger.log 2>&1 &
      - name: Hetzner and DigitalOcean (stand-ins for their APIs)
        run: nohup python3 install/test/cloud-mock.py 9300 /tmp > /tmp/cloud.log 2>&1 &
      - name: Answers (on "your computer")
        run: |
          tee anypress.env > /dev/null <<ANSWERS
          ANYPRESS_BRAND_DOMAIN=anypress-ci.test
          ANYPRESS_STORE_DOMAIN=anypress-ci-sites.test
          ANYPRESS_ADMIN_EMAIL=ci@anypress.io
          ANYPRESS_API_REF=${{ github.head_ref || github.ref_name }}
          S3_ENDPOINT=http://$S3_HOST:9000
          S3_BUCKET=anypress-ci
          S3_ACCESS_KEY_ID=anypress-ci
          S3_SECRET_ACCESS_KEY=anypress-ci-secret
          S3_REGION=us-east-1
          CLOUDFLARE_API_TOKEN=ci-cloudflare-token
          ANYPRESS_CLOUDFLARE_API=http://127.0.0.1:9100/client/v4
          ANYPRESS_TEMPLATES_DIR=${{ !inputs.release && '/tmp/templates' || '' }}
          HOSTINGER_API_TOKEN=ci-hostinger-token
          ANSWERS
      - name: Hostinger front door (sets up the VPS with the installer as its post-install script)
        env:
          ANYPRESS_HOSTINGER_API: http://127.0.0.1:9200
          ANYPRESS_SSH_KEY: none
        run: |
          bash install/anypress-install.sh hostinger
          curl -s http://127.0.0.1:9200/state > hostinger.json
          jq -c '.requests[] | select(.method != "GET")' hostinger.json
          [ "$(jq '.scripts | length' hostinger.json)" = 0 ] || { echo "the post-install script was left in the account"; exit 1; }
          jq -e '.requests[] | select(.path | endswith("/setup")) | .body | .template_id == 1077 and .data_center_id == 17 and (.password | length) >= 12' hostinger.json
          [ "$(wc -c < /tmp/post_install)" -le 49152 ] || { echo "post-install script over 48 KB"; exit 1; }
          ! grep -q HOSTINGER_ /tmp/post_install || { echo "the Hostinger token went to the server"; exit 1; }
      - name: Hetzner and DigitalOcean front doors (make the server with the same script as user data)
        env:
          ANYPRESS_HETZNER_API: http://127.0.0.1:9300/hetzner/v1
          ANYPRESS_DIGITALOCEAN_API: http://127.0.0.1:9300/digitalocean/v2
          ANYPRESS_SSH_KEY: none
          HETZNER_API_TOKEN: ci-hetzner-token
          HETZNER_SERVER_TYPE: cpx41
          DIGITALOCEAN_TOKEN: ci-digitalocean-token
        run: |
          bash install/anypress-install.sh hetzner
          bash install/anypress-install.sh digitalocean
          curl -s http://127.0.0.1:9300/state | jq -c '.requests[] | select(.method == "POST")'
          for f in /tmp/post_install /tmp/hetzner-user-data /tmp/digitalocean-user-data; do
            bash -n "$f"
            # The installer it carries is this one.
            sed -n '/^base64 -d/,/^ANYPRESS_END_/p' "$f" | sed '1d;$d' | base64 -d | gunzip | cmp - install/anypress-install.sh
            ! grep -q 'HOSTINGER_\|HETZNER_\|DIGITALOCEAN_' "$f" || { echo "a provider token went to the server in $f"; exit 1; }
          done
          [ "$(wc -c < /tmp/hetzner-user-data)" -le 32768 ]
      - name: Install (the post-install script, run as Hostinger runs it)
        run: |
          sudo bash /tmp/post_install
          [ "$(sudo cat /root/anypress/post-install.status)" = 0 ]
      - name: Install again (nothing new is made)
        run: |
          sudo cp /root/anypress/state.env /tmp/state-before
          sudo bash install/anypress-install.sh
          sudo diff /tmp/state-before /root/anypress/state.env
      - name: Check
        run: |
          sudo bash install/anypress-install.sh check | tee check.txt || true
          for line in "Coolify is running" "Coolify's API takes the token" "The API answers /health" "The dashboard is running" "The Coolify cleanup job is set" \
                      "The store templates are published" "The storefront is built"; do
            grep -q "ok.*$line" check.txt || { echo "Failed: $line"; exit 1; }
          done
      - name: DNS records (five set on the first run, nothing written on the second)
        run: |
          curl -s http://127.0.0.1:9100/state | tee dns.json | jq .
          [ "$(jq '.result.writes | length' dns.json)" = 5 ] || { echo "expected 5 writes"; exit 1; }
          [ "$(jq '[.result.records[] | select(.proxied == false)] | length' dns.json)" = 5 ] || { echo "expected 5 DNS-only records"; exit 1; }
      - name: Logs
        if: failure()
        run: |
          sudo docker ps -a
          sudo tail -50 /root/anypress/coolify-install.log || true
          tail -30 /tmp/s3.log || true
          sudo tail -50 /root/anypress/install.log 2>/dev/null || true
          for c in $(sudo docker ps -aq); do echo "== $(sudo docker inspect -f '{{.Name}}' $c)"; sudo docker logs --tail 40 $c 2>&1; done
