# Library updates: one grouped PR a month per kind; major versions come on their own.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/agent"
      - "/agent/panel"
      - "/integrations/n8n"
      - "/integrations/zapier"
      - "/voice"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: composer
    directories:
      - "/sdk/php"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directories:
      - "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
