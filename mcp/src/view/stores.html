<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stores</title>
<style>
/*VIEW_STYLE*/
</style>
</head>
<body>
<main>
  <header>
    <h1>Stores <span class="count" id="count"></span></h1>
    <input type="search" id="filter" placeholder="Filter" aria-label="Filter stores">
    <button id="refresh">Refresh</button>
  </header>
  <div id="status" class="msg">Loading…</div>
  <ul id="list"></ul>
</main>
<script type="module">/*MCP_APPS_BUNDLE*/</script>
<script type="module">/*VIEW_COMMON*/</script>
<script type="module">
  const { $, el, pill, message, errorText, start } = globalThis.WaasView;
  let stores = [];
  let canBackup = false;
  let canChange = false;
  let loaded = false;
  let view;

  function show(result) {
    const data = result?.structuredContent;
    if (result?.isError || !data) return message(errorText(result, 'Could not load stores.'), true);
    stores = data.stores ?? [];
    // Older servers sent readOnly only.
    canBackup = data.canBackup ?? !data.readOnly;
    canChange = data.canChange ?? !data.readOnly;
    loaded = true;
    render();
  }

  view = await start({ name: 'WaaS stores', show, refresh: (app) => app.callServerTool({ name: 'show_stores', arguments: {} }) });

  function render() {
    if (!view || !loaded) return;
    const q = $('filter').value.trim().toLowerCase();
    const shown = stores.filter((s) => !q || [s.name, s.externalId, s.domainName].some((v) => v?.toLowerCase().includes(q)));
    $('count').textContent = `(${stores.length})`;
    message(stores.length ? (shown.length ? '' : 'No store matches.') : 'No stores yet.');
    $('list').replaceChildren(...shown.map(row));
  }
  view.setRender(render);

  function row(store) {
    const info = el('div', {},
      el('div', {}, el('span', { className: 'name', textContent: store.name ?? store.externalId }), ' ', pill(store)),
      el('div', { className: 'meta' }, ...(store.domainName ? [view.link(store.domainName)] : []), el('span', { textContent: `id ${store.externalId}` }), el('span', { textContent: store.versionName ?? '' })),
    );
    const actions = el('div', { className: 'actions' });
    if (store.statusCode === 1) {
      const what = `store ${store.externalId}`;
      const args = (tool, action) => ({ key: `${tool}:${action}:${store.id}`, tool, what, args: { action, tenantId: store.id } });
      if (canBackup) actions.append(view.button({ ...args('manage_backups', 'create'), label: 'Back up' }));
      if (canChange) actions.append(store.isSuspended ? view.button({ ...args('store_status', 'resume'), label: 'Resume' }) : view.button({ ...args('store_status', 'suspend'), label: 'Suspend', destructive: true }));
    }
    return el('li', {}, info, actions);
  }

  $('filter').addEventListener('input', render);
  render();
</script>
</body>
</html>
