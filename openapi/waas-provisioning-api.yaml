- name: Partner API
  description: 'Phase 2, reseller feature. Partner API Authorization works the same as authorization with an Product Specific API key. When making use of a Partner API Key a query string parameter needs to be specified when calling the following (Product specific) endpoints:

    - Tenant

    - Version

    - Snapshot


    The ProductId is passed by supplying it in the querystring as so:


    ```bash

    $ curl \

    -H "Authorization: Basic MTExMTExMTEtMjIyMi0zMzMzLTQ0NDQtMTExMTExMTExMTExOnNvbWUtZ2VuZXJhdGVkLXNlY3JldAo=" \

    {{baseUrl}}/v1/tenants?productId=68c6b25c-74ef-4401-acbe-0b1d560d8647

    ```

    '
