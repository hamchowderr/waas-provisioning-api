openapi: 3.0.1
info:
  license:
    name: GPL-3.0-or-later
    url: https://www.gnu.org/licenses/gpl-3.0.html
  title: WaaS Provisioning API
  description: 'Contract for the AnyPress provisioning API. The storefront and client plugins depend on these paths, parameters and field names, so they do not change.


    **Phase 1 (22 operations):** tenants, tenant domains, versions, snapshots. Everything the storefront plugin calls. Five of them are added for AnyPress: suspend, resume, restore a deleted tenant, list backups and back up a tenant (tag TenantLifecycle), so a cancelled subscription keeps its store for a grace period before it is deleted, and a deleted store can come back from its backup.


    **Phase 2 (11 operations): reseller feature.** Subscriptions, products, base snapshots (templates) and usage, used with reseller (partner) keys. Product-scoped calls then take `productId`.


    **Writes are asynchronous.** Every create, update or delete returns once scheduled; poll the matching GET for `statusCode` (0 Pending, 1 Done, 2 Failed, 3 Removing).


    **Requirements found in the plugin code, not in the original spec** (every call site traced; see the teardown''s Contract cross-check):


    - `onlyProductionVersion=true` on GET /v1/snapshots.

    - The API generates `externalId` when it is omitted on tenant creation.

    - Invalid credentials return 403, not 401.

    - Store domains are bare hostnames; the plugin adds https://.

    - A tenant''s `domainName` equals the creation-time `customDomain ?? baseDomain` exactly.

    - `customDomain` is null or absent when there is none, never an empty string.

    - `statusCode` is a JSON integer and `isProduction` a JSON boolean (strict comparisons).

    - Accept `Content-Type: application/json` on bodiless GET/DELETE, unencoded query values, and `[]` as an empty PUT body. Any 2xx is success.


    **Provisioning requirements (inside each store, not visible in HTTP):** environment variable `WPCS_IS_TENANT=true` visible to PHP; each `phpConstants` entry written as `define()`; `wpOptions` applied; the WordPress user created with the requested role; the WaaS Client plugin active; `roles.json` served publicly at `https://{production version domain}/wp-content/plugins/waas-client-data/roles.json`; `/wp-json/waas-client/v1/single_login/verify` reachable; and the store''s home page answers `HEAD https://{domain}` with 200 and no redirect, or it never reaches Ready.


    History: docs/contract.md.'
  version: 1.1.0
servers:
- url: https://e98e6601-f3d6-40a0-a8bc-aa214b55a47e.mock.pstmn.io
  description: Postman mock (private; send x-api-key)
- url: http://localhost:4111
  description: Local
paths:
  /v1/tenants:
    get:
      tags:
      - Tenant
      summary: List tenants
      description: 'Phase 1 (storefront plugin).


        Gets tenants for a product. Use the ExternalId or TenantId of a tenant to filter the list to a specific tenant


        **Storefront plugin:** the status checker calls `?externalId=` and reads the first item''s `statusCode` (0 = still provisioning) and `domainName` (must equal the store''s target domain before it moves on). `WPCSService.php:184`, `WPCSTenantStatusService.php:81`.'
      parameters:
      - name: tenantId
        in: query
        description: Specify a tenantId to filter to a specific tenant.
        schema:
          type: string
          format: uuid
      - name: externalId
        in: query
        description: Specify an ExternalId to filter to a specific tenant.
        schema:
          type: string
      - name: productId
        in: query
        description: 'Reseller (partner) keys only: the product to act on. Ignored for product keys, which are already tied to one product. Phase 2.'
        schema:
          type: string
          format: uuid
        x-phase: 2
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetTenantQueryResult'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      x-phase: 1
      operationId: listTenants
    post:
      tags:
      - Tenant
      summary: Create tenant
      description: 'Phase 1 (storefront plugin).


        Schedule the creation of a new tenant


        **Storefront plugin:** sends `name`, `wordPressUserName`, `wordPressUserEmail`, `wordPressUserRole`, optional `wordPressUserPassword`, `customDomainName`, `groupName`, and `phpConstants` (`WPCS_TENANT_ROLES`, `WPCS_PUBLIC_KEY`, `WPCS_TENANT_NO_ADMINISTRATOR_PLUGIN_CAPS`). Release 2.2.7 never sends `externalId`, so **the API must generate one** and return it; the fork sends one chosen when the signup is queued, and looks the store up by it before retrying. Reads `externalId`, `baseDomain`, `customDomain` from the response. `WPCSService.php:100-123`, `TenantsSubscriptionManager.php:68-96`.


        **An `externalId` already in use** by a tenant of the product: a repeat of the create that made it (same `name`, and the same `customDomainName`, `versionId`, `snapshotId` and `groupName` where given) returns 200 with that tenant (`id`, `externalId`, `baseDomain`, and `customDomain` when one was asked for), so a client can safely retry a create whose answer it lost. Anything else returns 409 (`externalId <id> is already in use by another store`), as does a repeat while that tenant is being removed. The existing tenant is never changed and no second tenant is created, also when requests with the same `externalId` arrive at once. A `customDomainName` already used by another store returns 400 (`Domain <domain> is already in use`).'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantParams'
      responses:
        '200':
          description: The tenant creation was scheduled succesfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTenantCommandResult'
        '400':
          description: The validation of the request failed. See the message in the response to see why
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResult'
        '409':
          description: The externalId is already used by a different tenant of the product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResult'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      x-phase: 1
      operationId: createTenant
      parameters:
      - name: productId
        in: query
        description: 'Reseller (partner) keys only: the product to act on. Ignored for product keys, which are already tied to one product. Phase 2.'
        schema:
          type: string
          format: uuid
        x-phase: 2
    put:
      tags:
      - Tenant
      summary: Update tenant options and constants
      description: 'Phase 1 (storefront plugin).


        Schedule an update of a Tenant specifically for WP Options or PHP Constants, or its `size`


        **`size`:** a size other than the tenant''s current one moves it to that size (its CPU, memory, storage and monthly email quota), restarting the store once; the tenant is Pending until it is done. Its current size changes nothing.


        **Storefront plugin:** `?externalId=` with `phpConstants` (updated roles) and/or `wpOptions`. `WPCSService.php:126-141`.'
      parameters:
      - name: tenantId
        in: query
        description: Specify a tenantId to filter to a specific tenant.
        schema:
          type: string
          format: uuid
      - name: externalId
        in: query
        description: Specify an ExternalId to filter to a specific tenant.
        schema:
          type: string
      - name: productId
        in: query
        description: 'Reseller (partner) keys only: the product to act on. Ignored for product keys, which are already tied to one product. Phase 2.'
        schema:
          type: string
          format: uuid
        x-phase: 2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantParams'
      responses:
        '200':
          description: The tenant update was scheduled succesfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateTenantCommandResult'
        '400':
          description: The validation of the request failed. See the message in the response to see why
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResult'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      x-phase: 1
      operationId: updateTenantOptionsAndConstants
    delete:
      tags:
      - Tenant
      summary: Delete tenant
      description: 'Phase 1 (storefront plugin).


        Remove the tenant


        **Storefront plugin:** release 2.2.7 sends the external ID as `tenantId` (bug H1 in the review). The fork will send `externalId`; the API should also look up `tenantId` values that aren''t UUIDs as external IDs during the transition. `WPCSService.php:145`.'
      parameters:
      - name: tenantId
        in: query
        description: The Id of the Tenant to delete (required if externalId is omitted)
        schema:
          type: string
          format: uuid
      - name: externalId
        in: query
        description: The Id of the Tenant to delete (required if tenantId is omitted)
        schema:
          type: string
      - name: productId
        in: query
        description: 'Reseller (partner) keys only: the product to act on. Ignored for product keys, which are already tied to one product. Phase 2.'
        schema:
          type: string
          format: uuid
        x-phase: 2
      responses:
        '200':
          description: The deletion of the tenant was scheduled succesfully
        '400':
          description: The validation of the request failed. See the message in the response to see why
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResult'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      x-phase: 1
      operationId: deleteTenant
  /v1/tenants/domain:
    post:
      tags:
      - Tenant
      summary: Add domain (deprecated)
      description: 'Phase 1 (storefront plugin).


        Schedule the addition of a domain to the tenant. For more info see our [domains section](docs/tenants/domains)'
      parameters:
      - name: tenantId
        in: query
        description: The Id of the Tenant to which to add a domain (required if externalId is omitted)
        schema:
          type: string
          format: uuid
      - name: externalId
        in: query
        description: The Id of the Tenant to which to add a domain (required if tenantId is omitted)
        schema:
          type: string
      - name: productId
        in: query
        description: 'Reseller (partner) keys only: the product to act on. Ignored for product keys, which are already tied to one product. Phase 2.'
        schema:
          type: string
          format: uuid
        x-phase: 2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTenantDomainParams'
      responses:
        '200':
          description: The addition of the domain was scheduled succesfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddTenantDomainCommandResult'
        '400':
          description: The validation of the request failed. See the message in the response to see why
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResult'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      deprecated: true
      x-phase: 1
      operationId: addDomainDeprecated
  /v1/tenants/version:
    post:
      tags:
      - Tenant
      summary: Move tenant to a version
      description: 'Phase 1 (storefront plugin).


        Move the tenant identified by the tenantId or externalId to a target version'
      parameters:
      - name: tenantId
        in: query
        description: The Id of the Tenant to move (required if externalId is omitted)
        schema:
          type: string
          format: uuid
      - name: externalId
        in: query
        description: The ExternalId of the Tenant to move (required if tenantId is omitted)
        schema:
          type: string
      - name: productId
        in: query
        description: 'Reseller (partner) keys only: the product to act on. Ignored for product keys, which are already tied to one product. Phase 2.'
        schema:
          type: string
          format: uuid
        x-phase: 2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveVersionParams'
      responses:
        '200':
          description: The move of the tenant to a new version was scheduled succesfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveTenantCommandResult'
        '400':
          description: The validation of the request failed. See the message in the response to see why
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResult'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      x-phase: 1
      operationId: moveTenantToAVersion
  /v1/tenants/suspend:
    post:
      tags:
      - TenantLifecycle
      summary: Suspend tenant
      description: 'Phase 1 (storefront plugin). Added for AnyPress.


        Schedule the suspension of the tenant. A suspended tenant keeps its files, database and domains, but is not served: every domain answers with HTTP 503 and a shared "website unavailable" page (no redirect), WordPress cron does not run, and `/wp-json/waas-client/v1/single_login/verify` is not reachable. `takeBackup` (default true) takes a full backup (files and database) before the tenant goes offline; its id is returned as `backupId`.


        Idempotent: suspending a suspended tenant returns 200 and changes nothing (no second backup). Operations on one tenant run in the order they are received, so a later delete waits for the suspension and its backup to finish. Backups outlive the tenant: deleting a tenant does not delete its backups; they are kept for 90 days after the tenant is deleted.


        **Storefront plugin:** called when a subscription is cancelled or expires, before the deletion that follows after the grace period. Sends `{"takeBackup": true}`. `WPCSService::suspend_tenant`, `TenantsSubscriptionManager::suspend_tenant_when_subscription_expired`.'
      parameters:
      - name: tenantId
        in: query
        description: The Id of the Tenant to suspend (required if externalId is omitted)
        schema:
          type: string
          format: uuid
      - name: externalId
        in: query
        description: The ExternalId of the Tenant to suspend (required if tenantId is omitted)
        schema:
          type: string
        example: store-1042
      - name: productId
        in: query
        description: 'Reseller (partner) keys only: the product to act on. Ignored for product keys, which are already tied to one product. Phase 2.'
        schema:
          type: string
          format: uuid
        x-phase: 2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspendTenantParams'
            examples:
              withBackup:
                summary: 'Suspend tenant: Scheduled with backup'
                value:
                  takeBackup: true
      responses:
        '200':
          description: The suspension of the tenant was scheduled succesfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantLifecycleCommandResult'
              examples:
                scheduledWithBackup:
                  summary: 'Suspend tenant: Scheduled with backup'
                  value:
                    tenantId: 90b97b83-b320-4006-aaa8-dacb0639325c
                    externalId: store-1042
                    backupId: 3f6d2c1e-8a4b-4f0e-9c7d-5b2a1e0f9d84
                alreadySuspended:
                  summary: 'Suspend tenant: Already suspended'
                  value:
                    tenantId: 90b97b83-b320-4006-aaa8-dacb0639325c
                    externalId: store-1042
                    backupId: null
        '400':
          description: The validation of the request failed. See the message in the response to see why
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResult'
              examples:
                unknownTenant:
                  summary: 'Suspend tenant: 400 Unknown tenant'
                  value:
                    statusCode: 400
                    message: No tenant with externalId store-9999
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      x-phase: 1
      operationId: suspendTenant
  /v1/tenants/resume:
    post:
      tags:
      - TenantLifecycle
      summary: Resume tenant
      description: 'Phase 1 (storefront plugin). Added for AnyPress.


        Schedule the resumption of a suspended tenant: it is served again on the same domains, with the files and database it had when it was suspended. No body.


        Idempotent: resuming a tenant that is not suspended returns 200 and changes nothing.


        **Storefront plugin:** called when a subscription becomes active again within the grace period. `WPCSService::resume_tenant`, `TenantsSubscriptionManager::create_tenant_when_subscription_created`.'
      parameters:
      - name: tenantId
        in: query
        description: The Id of the Tenant to resume (required if externalId is omitted)
        schema:
          type: string
          format: uuid
      - name: externalId
        in: query
        description: The ExternalId of the Tenant to resume (required if tenantId is omitted)
        schema:
          type: string
        example: store-1042
      - name: productId
        in: query
        description: 'Reseller (partner) keys only: the product to act on. Ignored for product keys, which are already tied to one product. Phase 2.'
        schema:
          type: string
          format: uuid
        x-phase: 2
      responses:
        '200':
          description: The resumption of the tenant was scheduled succesfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantLifecycleCommandResult'
              examples:
                scheduled:
                  summary: 'Resume tenant: Scheduled'
                  value:
                    tenantId: 90b97b83-b320-4006-aaa8-dacb0639325c
                    externalId: store-1042
                    backupId: null
        '400':
          description: The validation of the request failed. See the message in the response to see why
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResult'
              examples:
                unknownTenant:
                  summary: 'Resume tenant: 400 Unknown tenant'
                  value:
                    statusCode: 400
                    message: No tenant with externalId store-9999
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      x-phase: 1
      operationId: resumeTenant
  /v1/tenants/site:
    post:
      tags:
      - TenantSite
      summary: Edit the store's site
      description: 'Added for AnyPress.


        Passes one request on to the store''s site-editing API (WaaS Client 2.3.0 or newer: pages and their sections, patterns, colours and fonts, header and footer, menus, revisions and images), signed with the store''s own site key, and answers with the store''s reply. `path` is under `/site`: `''''` for the site itself, `/pages`, `/pages/12/sections/0` and so on. The routes are listed in the [site editing guide](https://github.com/hamchowderr/waas-provisioning-api/blob/main/docs/site-editing.md).


        The tenant must be Done and not suspended. A 4xx from the store comes back in `status` and `body` (with 200 here), so the caller can read the store''s explanation.'
      parameters:
      - name: tenantId
        in: query
        description: The Id of the Tenant (required if externalId is omitted)
        schema:
          type: string
          format: uuid
      - name: externalId
        in: query
        description: The ExternalId of the Tenant (required if tenantId is omitted)
        schema:
          type: string
        example: store-1042
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteRequestParams'
            examples:
              addSection:
                summary: Add a pattern to a page
                value:
                  method: POST
                  path: /pages/12/sections
                  body:
                    pattern: ollie/hero-light
                    position: 0
      responses:
        '200':
          description: The store's answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteRequestResult'
              examples:
                added:
                  summary: 'Edit the store''s site: Section added'
                  value:
                    status: 200
                    body:
                      id: 12
                      title: About us
                      status: draft
        '400':
          description: The validation of the request failed. See the message in the response to see why
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResult'
              examples:
                suspended:
                  summary: 'Edit the store''s site: 400 Suspended'
                  value:
                    statusCode: 400
                    message: Tenant store-1042 is suspended
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '502':
          description: The store did not answer, or refused the signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResult'
      operationId: editTenantSite
  /v1/tenants/email-packs:
    post:
      tags:
      - Tenant
      summary: Add an email pack
      description: 'Added for AnyPress.


        Adds emails on top of the store''s plan, which includes a number of emails each calendar month (UTC) from its size. Pack emails never expire: once a month''s plan emails are used, the store sends from its packs, and only when those are used up too do campaigns and sequences (FluentCRM) wait for the next month. Order, account and booking emails always go out. The store''s administrators see how many pack emails are left.


        `reference` is an idempotency key, such as the shop''s order (`fluentcart-order-123`): a repeat with a reference this tenant already used adds nothing and returns the same answer. `emailPacks` is the total of emails bought for the tenant so far.


        The tenant shows `statusCode` 0 (Pending) until the store has the new total, then 1 (Done). Rejected for a tenant that is being removed or has failed.'
      parameters:
      - name: tenantId
        in: query
        description: The Id of the Tenant (required if externalId is omitted)
        schema:
          type: string
          format: uuid
      - name: externalId
        in: query
        description: The ExternalId of the Tenant (required if tenantId is omitted)
        schema:
          type: string
        example: store-1042
      - name: productId
        in: query
        description: 'Reseller (partner) keys only: the product to act on. Ignored for product keys, which are already tied to one product. Phase 2.'
        schema:
          type: string
          format: uuid
        x-phase: 2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailPackParams'
            examples:
              order:
                summary: 'Add an email pack: From a shop order'
                value:
                  emails: 10000
                  reference: fluentcart-order-123
      responses:
        '200':
          description: The pack was recorded (or had been already) and is being applied to the store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailPackResult'
              examples:
                added:
                  summary: 'Add an email pack: Added'
                  value:
                    tenantId: 90b97b83-b320-4006-aaa8-dacb0639325c
                    externalId: store-1042
                    emailPacks: 10000
        '400':
          description: The validation of the request failed. See the message in the response to see why
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResult'
              examples:
                unknownTenant:
                  summary: 'Add an email pack: 400 Unknown tenant'
                  value:
                    statusCode: 400
                    message: Tenant store-9999 not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      operationId: addTenantEmailPack
  /v1/tenants/restore:
    post:
      tags:
      - TenantLifecycle
      summary: Restore deleted tenant
      description: 'Phase 1 (storefront plugin). Added for AnyPress.


        Schedule the re-creation of a deleted tenant from one of its kept backups (backups are kept for 90 days after the tenant is deleted). The tenant comes back with the same `externalId`, the same domains (base domain and custom domains, the main domain unchanged) and the files, database, `phpConstants` and `wpOptions` it had when the backup was taken. It is not suspended after the restore. `backupId` picks the backup; when omitted, the newest backup with `statusCode` 1 (Done) is used. Poll List tenants with the `externalId` for `statusCode` (0 while restoring, 1 when done), as after Create tenant.


        Returns 400 when the tenant is not deleted, or when it has no kept backup (or `backupId` is not one of its Done backups). The storefront treats that 400 as "nothing to restore" only after List tenant backups returned no Done backup; it never creates a second store because of an error.


        **Storefront plugin:** called when a subscription becomes active again after its store was deleted at the end of the grace period. Lists the backups first, sends the newest Done `backupId`, and creates a fresh store only when there is none. `WPCSService::restore_tenant`, `TenantsSubscriptionManager::restore_or_recreate_deleted_tenant`.'
      parameters:
      - name: tenantId
        in: query
        description: The Id of the deleted Tenant to restore (required if externalId is omitted)
        schema:
          type: string
          format: uuid
      - name: externalId
        in: query
        description: The ExternalId of the deleted Tenant to restore (required if tenantId is omitted)
        schema:
          type: string
        example: store-1042
      - name: productId
        in: query
        description: 'Reseller (partner) keys only: the product to act on. Ignored for product keys, which are already tied to one product. Phase 2.'
        schema:
          type: string
          format: uuid
        x-phase: 2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreTenantParams'
            examples:
              fromBackup:
                summary: 'Restore deleted tenant: Scheduled from a backup'
                value:
                  backupId: 3f6d2c1e-8a4b-4f0e-9c7d-5b2a1e0f9d84
      responses:
        '200':
          description: The restore of the tenant was scheduled succesfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantLifecycleCommandResult'
              examples:
                scheduled:
                  summary: 'Restore deleted tenant: Scheduled from a backup'
                  value:
                    tenantId: 90b97b83-b320-4006-aaa8-dacb0639325c
                    externalId: store-1042
                    backupId: 3f6d2c1e-8a4b-4f0e-9c7d-5b2a1e0f9d84
        '400':
          description: The validation of the request failed. See the message in the response to see why
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResult'
              examples:
                noBackup:
                  summary: 'Restore deleted tenant: 400 No backup to restore'
                  value:
                    statusCode: 400
                    message: Tenant store-1042 has no backup to restore
                notDeleted:
                  summary: 'Restore deleted tenant: 400 Tenant is not deleted'
                  value:
                    statusCode: 400
                    message: Tenant store-1042 is not deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
