openapi: 3.0.1
info:
  title: WaaS Provisioning API - admin
  version: 0.1.0
  description: >-
    Admin endpoints for the dashboard (waas-api-plu). The version
    and template endpoints under /admin/products/{productId} take the same requests and give the
    same responses as their /v1 operations (schemas referenced from openapi/waas-provisioning-api.yaml). They see every
    product. Authenticate with `Authorization: Bearer <ADMIN_TOKEN>`; anything else, product keys
    included, gets 403. When ADMIN_TOKEN is not set, every request gets 403.


    The same endpoints answer a signed-in customer at /account instead of /admin (docs/accounts.md),
    narrowed to their organization's product: lists hold only that product, another product's records
    are 404, and the platform-only endpoints (creating products, product limits, plugins, database
    backups, organizations) are 404.
servers:
  - url: http://localhost:4111
    description: Local
security:
  - adminToken: []
paths:
  /admin/overview:
    get:
      operationId: adminOverview
      summary: Counts, health and products
      responses:
        '200':
          description: Overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Overview' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/products:
    get:
      operationId: adminListProducts
      summary: Products (storefronts)
      responses:
        '200':
          description: All products, by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Product' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: adminCreateProduct
      summary: A new product (an agency's storefront) with its first API key
      description: >-
        The key's secret is in this response only (Cache-Control no-store); hand it to the agency
        once. They can then manage their own keys at /v1/keys (openapi/api-keys.yaml).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                maxTenants: { type: integer, minimum: 0, nullable: true }
                keyLabel: { type: string, maxLength: 100, nullable: true }
      responses:
        '201':
          description: The product and its first key with the secret
          content:
            application/json:
              schema:
                type: object
                required: [product, key]
                additionalProperties: false
                properties:
                  product: { $ref: '#/components/schemas/Product' }
                  key: { $ref: '../api-keys.yaml#/components/schemas/NewApiKey' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/products/{productId}/keys:
    parameters:
      - $ref: '#/components/parameters/productId'
    get:
      operationId: adminListApiKeys
      summary: A product's API keys
      description: Working keys and keys revoked in the last 30 days, newest first. Never secrets.
      responses:
        '200':
          description: Keys
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '../api-keys.yaml#/components/schemas/ApiKeyInfo' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: adminCreateApiKey
      summary: Create a key for a product (same rules as createApiKey)
      requestBody:
        content:
          application/json:
            schema: { $ref: '../api-keys.yaml#/components/schemas/CreateApiKey' }
      responses:
        '201':
          description: The new key with its secret, shown this once
          content:
            application/json:
              schema: { $ref: '../api-keys.yaml#/components/schemas/NewApiKey' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/products/{productId}/keys/{id}/rotate:
    parameters:
      - $ref: '#/components/parameters/productId'
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: adminRotateApiKey
      summary: Replace an active key (same rules as rotateApiKey)
      requestBody:
        content:
          application/json:
            schema: { $ref: '../api-keys.yaml#/components/schemas/RotateApiKey' }
      responses:
        '201':
          description: The new key with its secret, shown this once, and the key it replaces
          content:
            application/json:
              schema: { $ref: '../api-keys.yaml#/components/schemas/RotatedApiKey' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/products/{productId}/keys/{id}:
    parameters:
      - $ref: '#/components/parameters/productId'
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: adminRevokeApiKey
      summary: Revoke a key now
      description: Like revokeApiKey, except the product's last active key can be revoked, to cut a storefront off.
      responses:
        '200':
          description: The revoked key
          content:
            application/json:
              schema: { $ref: '../api-keys.yaml#/components/schemas/ApiKeyInfo' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/products/{productId}:
    parameters:
      - $ref: '#/components/parameters/productId'
    put:
      operationId: adminUpdateProduct
      summary: A product's settings (maxTenants)
      description: >-
        maxTenants is the most tenants the product may have (null: no limit). At the limit,
        createTenant and restoreTenant answer 400. Lowering it below the current count deletes
        nothing; it only stops new tenants.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [maxTenants]
              properties: { maxTenants: { type: integer, minimum: 0, nullable: true } }
      responses:
        '200':
          description: The product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/products/{productId}/organization:
    parameters:
      - $ref: '#/components/parameters/productId'
    get:
      operationId: adminGetOrganization
      summary: A product's organization, its members and pending invitations (docs/accounts.md)
      description: organization is null until one is made (PUT) or someone is invited.
      responses:
        '200':
          description: The organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationView' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: adminPutOrganization
      summary: Make the product's organization, or rename it
      description: Each product has at most one organization. name defaults to the product's name.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { name: { type: string, minLength: 1, maxLength: 100 } }
      responses:
        '200':
          description: Renamed (or already there)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationView' }
        '201':
          description: Made
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/products/{productId}/invitations:
    parameters:
      - $ref: '#/components/parameters/productId'
    post:
      operationId: adminInvite
      summary: Invite someone to the product's organization by email
      description: >-
        Makes the organization if there is none yet. The person signs in with that email address and
        accepts at acceptUrl within 7 days. A new invitation for the same address replaces a pending
        one. 503 when sign-in is off (AUTH_URL and AUTH_SECRET unset).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                role: { $ref: '#/components/schemas/OrganizationRole' }
      responses:
        '201':
          description: The invitation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/products/{productId}/invitations/{id}:
    parameters:
      - $ref: '#/components/parameters/productId'
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: adminCancelInvitation
      summary: Cancel a pending invitation
      responses:
        '200':
          description: The organization after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationView' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/products/{productId}/members/{id}:
    parameters:
      - $ref: '#/components/parameters/productId'
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: adminRemoveMember
      summary: Remove someone from the product's organization
      description: Their account stays; it can no longer reach this product.
      responses:
        '200':
          description: The organization after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationView' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/products/{productId}/versions:
    parameters:
      - $ref: '#/components/parameters/productId'
    get:
      operationId: adminListVersions
      summary: A product's versions (as listVersions)
      parameters:
        - { name: versionId, in: query, schema: { type: string, format: uuid } }
        - { name: versionName, in: query, schema: { type: string } }
      responses:
        '200':
          description: Same response as GET /v1/versions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '../waas-provisioning-api.yaml#/components/schemas/GetVersionQueryResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: adminCreateVersion
      summary: Create a version for a product (as createVersion)
      requestBody:
        content:
          application/json:
            schema: { $ref: '../waas-provisioning-api.yaml#/components/schemas/CreateVersionParams' }
      responses:
        '200':
          description: Same response as POST /v1/versions
          content:
            application/json:
              schema: { $ref: '../waas-provisioning-api.yaml#/components/schemas/CreateVersionCommandResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/products/{productId}/versions/{id}:
    parameters:
      - $ref: '#/components/parameters/productId'
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: adminDeleteVersion
      summary: Remove a non-production version (as deleteVersion)
      responses:
        '200':
          description: Removal scheduled; no body, as DELETE /v1/versions
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/products/{productId}/versions/{id}/production:
    parameters:
      - $ref: '#/components/parameters/productId'
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: adminSetProductionVersion
      summary: Make a version the product's production version (as setProductionVersion)
      responses:
        '200':
          description: Same response as PUT /v1/versions/production
          content:
            application/json:
              schema: { $ref: '../waas-provisioning-api.yaml#/components/schemas/SetProductionVersionCommandResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/products/{productId}/basesnapshots:
    parameters:
      - $ref: '#/components/parameters/productId'
    get:
      operationId: adminListBaseSnapshots
      summary: A product's templates (as listBaseSnapshotsTemplates)
      parameters:
        - { name: baseSnapshotId, in: query, schema: { type: string, format: uuid } }
        - { name: name, in: query, schema: { type: string } }
        - { name: groupName, in: query, schema: { type: string } }
      responses:
        '200':
          description: Same response as GET /v1/basesnapshots
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '../waas-provisioning-api.yaml#/components/schemas/GetBaseSnapshotsQueryResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: adminCreateBaseSnapshot
      summary: Create a template for a product (as createBaseSnapshotTemplateUpload)
      requestBody:
        content:
          application/json:
            schema: { $ref: '../waas-provisioning-api.yaml#/components/schemas/CreateBaseSnapshotParams' }
      responses:
        '200':
          description: Same response as POST /v1/basesnapshots
          content:
            application/json:
              schema: { $ref: '../waas-provisioning-api.yaml#/components/schemas/CreateBaseSnapshotCommandResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: adminDeleteBaseSnapshot
      summary: Delete a template (as deleteBaseSnapshot)
      parameters:
        - { name: id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Same response as DELETE /v1/basesnapshots
          content:
            application/json:
              schema: { $ref: '../waas-provisioning-api.yaml#/components/schemas/RemoveBaseSnapshotCommandResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/tenants:
    get:
      operationId: adminListTenants
      summary: Tenants across all products
      parameters:
        - { name: productId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: integer, minimum: 0, maximum: 3 } }
        - { name: suspended, in: query, schema: { type: boolean } }
        - { name: versionId, in: query, schema: { type: string, format: uuid } }
        - name: q
          in: query
          description: 'Matches external id, name or any domain (case-insensitive substring).'
          schema: { type: string }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: One page of tenants, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/TenantRow' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/tenants/{id}:
    get:
      operationId: adminGetTenant
      summary: One tenant with domains, backups, recent jobs and failures
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/tenants/{id}/domains/main:
    put:
      operationId: adminSetTenantMainDomain
      summary: Make a domain the store's main address
      description: >-
        Adds the domain if the tenant doesn't have it yet and makes it the main domain, like
        addTenantDomain with setAsMainDomain, for any product. The old main domain stays as a
        redirect. The tenant is Pending until the domain job finishes. 400 when the domain is
        invalid or taken, or the tenant is Removing or Failed.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domainName]
              properties:
                domainName: { type: string }
      responses:
        '200':
          description: The domain now being applied as main
          content:
            application/json:
              schema:
                type: object
                required: [tenantId, externalId, domain, setAsMainDomain]
                properties:
                  tenantId: { type: string, format: uuid }
                  externalId: { type: string }
                  domain: { type: string }
                  setAsMainDomain: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/tenants/{id}/domain-connect:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getStoreDomainConnect
      summary: A link that adds the store's DNS records at the domain's DNS host (Domain Connect)
      description: >-
        service website gives the domain's A record (one of the store's domains); email gives its
        sending domain's DKIM, MX and SPF records. 400 when the domain isn't the store's or Domain
        Connect is off.
      parameters:
        - { name: domainName, in: query, required: true, schema: { type: string } }
        - { name: service, in: query, required: true, schema: { type: string, enum: [website, email] } }
      responses:
        '200':
          description: The link, when the DNS host supports it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainConnectLink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/tenants/{id}/restore:
    post:
      operationId: adminRestoreTenant
      summary: Roll a live store back to one of its backups
      description: >-
        Replaces the store's files and database with one of its own Done backups, in place. The
        store keeps its current domains, version, PHP constants and suspension, and the tenant's
        current wpOptions are written again afterwards. Unless takeBackup is false, what the store
        holds now is backed up first (reason before-restore; its id is safetyBackupId), so the
        rollback can be undone by restoring that backup. The tenant is Pending until the job
        finishes. If that first backup fails the store is left untouched and Done. 400 when the
        backup is not a Done backup of this tenant, or the tenant is Removing or Failed.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [backupId]
              properties:
                backupId: { type: string, format: uuid }
                takeBackup: { type: boolean, default: true, description: Back up what the store holds now first. }
      responses:
        '200':
          description: The rollback was scheduled
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [tenantId, externalId, backupId, safetyBackupId]
                properties:
                  tenantId: { type: string, format: uuid }
                  externalId: { type: string }
                  backupId: { type: string, format: uuid }
                  safetyBackupId: { type: string, format: uuid, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/tenants/{id}/mail-domain:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: adminGetTenantMailDomain
      summary: The store's own sending domain
      description: >-
        The domain the store sends email from instead of the platform's address, with the DNS
        records its owner adds at their DNS host. null when it sends from the platform's address.
      responses:
        '200':
          description: The sending domain, or null
          content:
            application/json:
              schema:
                type: object
                required: [mailDomain]
                properties:
                  mailDomain: { anyOf: [{ $ref: '#/components/schemas/MailDomain' }, { type: object, nullable: true, enum: [null] }] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: adminSetTenantMailDomain
      summary: Give the store its own sending domain
      description: >-
        Adds the domain on toSend and returns the DNS records to add. The store keeps sending from
        the platform's address until toSend has verified the records (it checks every 10 minutes),
        then sends from no-reply (STORE_MAIL_FROM's name) at the domain. Setting the domain the
        store already has returns it. 400 when the domain is invalid, the platform's, another
        store's or on another toSend account, when the store already has a different one, or when
        TOSEND_ADMIN_KEY is not set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domainName]
              properties:
                domainName: { type: string }
      responses:
        '200':
          description: The sending domain
          content:
            application/json:
              schema:
                type: object
                required: [mailDomain]
                properties:
                  mailDomain: { $ref: '#/components/schemas/MailDomain' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: adminRemoveTenantMailDomain
      summary: Move the store back to the platform's address
      description: >-
        The domain's status becomes removing; within 10 minutes the store sends from the platform's
        address again and the domain leaves toSend. The owner's DNS records are not touched.
      responses:
        '200':
          description: The domain being removed
          content:
            application/json:
              schema:
                type: object
                required: [domainName]
                properties:
                  domainName: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/backups:
    get:
      operationId: adminListBackups
      summary: Backups across all products, including deleted tenants'
      parameters:
        - { name: productId, in: query, schema: { type: string, format: uuid } }
        - { name: tenantId, in: query, schema: { type: string, format: uuid } }
        - { name: externalId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: integer, minimum: 0, maximum: 3 } }
        - { name: tenantDeleted, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: One page of backups, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Backup' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/jobs:
    get:
      operationId: adminListJobs
      summary: Queued, running or failed jobs
      description: Failed means failed its last retry; those are kept in the job_failures table until retried.
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [queued, running, failed], default: queued } }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: One page of jobs, with counts for every tab
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [state, counts, items]
                    properties:
                      state: { type: string, enum: [queued, running, failed] }
                      counts: { $ref: '#/components/schemas/JobCounts' }
                      items:
                        type: array
                        items:
                          oneOf:
                            - $ref: '#/components/schemas/Job'
                            - $ref: '#/components/schemas/JobFailure'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/plugins:
    get:
      operationId: adminListPluginInstalls
      summary: Plugin versions sites report, and pins
      description: >-
        Every site that has checked for an update of one of our plugins (waas-hw4), with the version
        it last reported, and the products pinned to a release.
      parameters:
        - { name: productId, in: query, schema: { type: string, format: uuid } }
        - { name: slug, in: query, schema: { $ref: '#/components/schemas/PluginSlug' } }
      responses:
        '200':
          description: Installs and pins
          content:
            application/json:
              schema:
                type: object
                required: [installs, pins]
                additionalProperties: false
                properties:
                  installs: { type: array, items: { $ref: '#/components/schemas/PluginInstall' } }
                  pins: { type: array, items: { $ref: '#/components/schemas/PluginPin' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/products/{productId}/plugins/{slug}/pin:
    parameters:
      - $ref: '#/components/parameters/productId'
      - { name: slug, in: path, required: true, schema: { $ref: '#/components/schemas/PluginSlug' } }
    put:
      operationId: adminPinPlugin
      summary: Hold a product's sites at one plugin release
      description: >-
        Its update checks get this release whatever their channel says. The release must exist in
        the releases bucket (400 otherwise). A site only installs it when it is newer than the
        version it runs, so a pin holds sites back but never downgrades them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties: { version: { type: string, example: 2.3.0 } }
      responses:
        '200':
          description: The pin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginPin' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      operationId: adminUnpinPlugin
      summary: Remove the pin; the sites follow their channel again
      responses:
        '200': { description: Removed (also when there was no pin) }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/db-backups:
    get:
      operationId: adminListDbBackups
      summary: Off-site backups of the API's own database
      description: >-
        The status /health reports, plus each backup attempt, newest first, with its object key in
        the bucket and the error when it failed. prunedAt is set once retention deleted the object.
        Restore runbook: docs/db-backups.md.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Backup status and one page of attempts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - $ref: '#/components/schemas/DbBackupStatus'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/DbBackup' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/requests:
    get:
      operationId: adminListRequests
      summary: The request log
      description: >-
        Every product API call (/v1/*, failed sign-ins included) and every admin change (any /admin
        request but a GET), newest first. Records who called what and how it went, never what was
        sent: no bodies, no secrets, no headers but the user agent. The API key is its id (the Basic
        auth username). Rows older than REQUEST_LOG_DAYS (default 30) are deleted daily; 0 turns the
        log off.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - { name: productId, in: query, schema: { type: string, format: uuid } }
        - { name: tenantId, in: query, schema: { type: string, format: uuid } }
        - { name: source, in: query, schema: { type: string, enum: [v1, admin, account] } }
        - name: outcome
          in: query
          description: ok is below 400, client-error 4xx, server-error 5xx, error either.
          schema: { type: string, enum: [ok, client-error, server-error, error] }
        - { name: method, in: query, schema: { type: string, example: POST } }
        - { name: path, in: query, description: Matches any part of the path., schema: { type: string } }
      responses:
        '200':
          description: Counts for the last 24 hours and one page of requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items, last24Hours, retentionDays]
                    properties:
                      last24Hours:
                        type: object
                        additionalProperties: false
                        required: [total, clientErrors, serverErrors]
                        properties:
                          total: { type: integer }
                          clientErrors: { type: integer }
                          serverErrors: { type: integer }
                      retentionDays: { type: integer }
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/RequestLogEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/jobs/failures/{id}/retry:
    post:
      operationId: adminRetryFailure
      summary: Re-queue a failed job
      description: >-
        Puts the record the job worked on back to Pending (Removing for a delete) and queues the same
        job again. Only from Failed, so newer changes are never overwritten; otherwise 400.
        Idempotent: retrying a retried failure returns it unchanged.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The failure record, now retried
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobFailure' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/webhooks:
    get:
      operationId: adminListWebhooks
      summary: Every product's webhook endpoints, with how their deliveries went
      description: Secrets are never listed. See openapi/webhooks.yaml and docs/webhooks.md.
      parameters:
        - { name: productId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: By product name, then oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminWebhookEndpoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: adminCreateWebhook
      summary: Register an endpoint for a product
      description: Returns the signing secret, the only time it is shown.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEndpointParams'
                - type: object
                  required: [productId, url]
                  properties:
                    productId: { type: string, format: uuid }
      responses:
        '201':
          description: The endpoint with its secret
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/WebhookEndpoint'
                  - type: object
                    required: [secret]
                    properties:
                      secret: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/webhooks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: adminUpdateWebhook
      summary: Change an endpoint (turn it off or on, its URL or events)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEndpointParams' }
      responses:
        '200':
          description: The endpoint
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: adminDeleteWebhook
      summary: Remove an endpoint
      responses:
        '200':
          description: The endpoint removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpoint' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/webhooks/{id}/rotate-secret:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: adminRotateWebhookSecret
      summary: Give an endpoint a new signing secret; the old one stops working at once
      responses:
        '200':
          description: The endpoint with its new secret
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/WebhookEndpoint'
                  - type: object
                    required: [secret]
                    properties:
                      secret: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/webhooks/{id}/test:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: adminTestWebhook
      summary: Send a webhook.test event to this endpoint, enabled or not
      responses:
        '200':
          description: The delivery, pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDelivery' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/webhooks/deliveries:
    get:
      operationId: adminListWebhookDeliveries
      summary: Webhook deliveries across products, newest first
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - { name: productId, in: query, schema: { type: string, format: uuid } }
        - { name: endpointId, in: query, schema: { type: string, format: uuid } }
        - { name: tenantId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [pending, delivered, failed] } }
      responses:
        '200':
          description: One page of deliveries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/WebhookDelivery'
                            - type: object
                              required: [url, productId, productName, tenantName]
                              properties:
                                url: { type: string }
                                productId: { type: string, format: uuid }
                                productName: { type: string }
                                tenantName: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/webhooks/deliveries/{id}/retry:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: adminRetryWebhookDelivery
      summary: Send a delivery again (only once it was delivered or failed; otherwise 400)
      responses:
        '200':
          description: The delivery, pending again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDelivery' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    adminToken: { type: http, scheme: bearer }
  parameters:
    productId: { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
    page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    pageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
  responses:
    BadRequest:
      description: Invalid request
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Missing or wrong admin token
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Refused in the record's current state
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unavailable:
      description: Plugin updates are not configured (RELEASES_S3_BUCKET unset)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    OrganizationRole:
      type: string
      enum: [owner, admin, member]
      default: owner
      description: Owners and admins may make changes; members may only look.
    Invitation:
      type: object
      required: [id, email, role, expiresAt, dateCreated, acceptUrl]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: '#/components/schemas/OrganizationRole' }
        expiresAt: { type: string, format: date-time }
        dateCreated: { type: string, format: date-time }
        acceptUrl: { type: string, nullable: true, description: 'Where the person accepts: AUTH_URL/invite/<id>. null when sign-in is off.' }
    OrganizationView:
      type: object
      required: [organization, members, invitations]
      properties:
        organization:
          type: object
          nullable: true
          required: [id, name, productId, dateCreated]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            productId: { type: string, format: uuid }
            dateCreated: { type: string, format: date-time }
        members:
          type: array
          items:
            type: object
            required: [id, userId, name, email, role, dateCreated]
            properties:
              id: { type: string, format: uuid }
              userId: { type: string, format: uuid }
              name: { type: string }
              email: { type: string }
              role: { $ref: '#/components/schemas/OrganizationRole' }
              dateCreated: { type: string, format: date-time }
        invitations:
          type: array
          items: { $ref: '#/components/schemas/Invitation' }
    DomainConnectLink:
      type: object
      description: >-
        A link that sends the store owner to their DNS host, which adds the records once they approve
        (docs/domain-connect.md). Without one (the DNS host doesn't support Domain Connect or hasn't
        accepted the platform's template yet), show the records to copy by hand.
      required: [dnsProvider, supported, url]
      properties:
        dnsProvider: { type: string, nullable: true, description: The domain's DNS host, when it supports Domain Connect at all, example: Cloudflare }
        supported: { type: boolean, description: True when url works }
        url: { type: string, nullable: true }
    MailDomain:
      type: object
      required: [domainName, status, dateCreated, dateVerified, records]
      properties:
        domainName: { type: string }
        status: { type: string, enum: [pending, verified, removing] }
        dateCreated: { type: string, format: date-time }
        dateVerified: { type: string, format: date-time, nullable: true }
        records:
          description: The records to add at the domain's DNS host; null when toSend could not be reached.
          type: array
          nullable: true
          items:
            type: object
            required: [type, name, host, value, priority]
            properties:
              type: { type: string }
              name: { type: string, description: 'Relative to the domain, as most DNS hosts want it' }
              host: { type: string, description: The full hostname }
              value: { type: string }
              priority: { type: integer, nullable: true }
    Product:
      type: object
      additionalProperties: false
      required: [id, name, tenantCount, maxTenants, versionCount, productionVersionId, dateCreated]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        tenantCount: { type: integer }
        maxTenants: { type: integer, nullable: true, description: 'The most tenants it may have; null is no limit' }
        versionCount: { type: integer }
        productionVersionId: { type: string, format: uuid, nullable: true }
        dateCreated: { type: string, format: date-time }
    Error:
      type: object
      required: [statusCode, message]
      additionalProperties: false
      properties: { statusCode: { type: integer }, message: { type: string } }
    StatusCounts:
      type: object
      required: [pending, done, failed, removing]
      additionalProperties: false
      properties:
        pending: { type: integer }
        done: { type: integer }
        failed: { type: integer }
        removing: { type: integer }
    JobCounts:
      type: object
      required: [queued, running, failed]
      additionalProperties: false
      properties: { queued: { type: integer }, running: { type: integer }, failed: { type: integer } }
    Overview:
      type: object
      required: [health, tenants, versions, backups, jobs, products]
      additionalProperties: false
      properties:
        health:
          type: object
          required: [ok, database, queue, dbBackup]
          additionalProperties: false
          properties:
            ok: { type: boolean }
            database: { type: string, enum: [ok, down] }
            queue: { type: string, enum: [ok, down] }
            dbBackup: { $ref: '#/components/schemas/DbBackupStatus' }
        tenants:
          type: object
          additionalProperties: false
          required: [pending, done, failed, removing, suspended]
          properties:
            pending: { type: integer }
            done: { type: integer }
            failed: { type: integer }
            removing: { type: integer }
            suspended: { type: integer }
        versions: { $ref: '#/components/schemas/StatusCounts' }
        backups: { $ref: '#/components/schemas/StatusCounts' }
        jobs: { $ref: '#/components/schemas/JobCounts' }
        products:
          type: array
          items:
            type: object
            required: [id, name, tenantCount]
            additionalProperties: false
            properties: { id: { type: string, format: uuid }, name: { type: string }, tenantCount: { type: integer } }
    DbBackupStatus:
      type: object
      description: >-
        The newest backup of the API's database to object storage. status off means the S3_*
        settings are not set; none, no backup yet; unknown, the status could not be read. stale is
        true when the newest success is more than 26 hours old. Never affects health.ok.
      required: [status, lastAttemptAt, lastSuccessAt, sizeBytes, stale]
      properties:
        status: { type: string, enum: [off, none, running, ok, failed, unknown] }
        lastAttemptAt: { type: string, format: date-time, nullable: true }
        lastSuccessAt: { type: string, format: date-time, nullable: true }
        sizeBytes: { type: integer, nullable: true, description: Size of the newest successful backup (encrypted) }
        stale: { type: boolean }
    DbBackup:
      type: object
      required: [id, status, startedAt, finishedAt, objectKey, sizeBytes, error, prunedAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [running, ok, failed] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        objectKey: { type: string, nullable: true, example: db-backups/2026/10/07/waas-20261007T023000Z.dump.enc }
        sizeBytes: { type: integer, nullable: true }
        error: { type: string, nullable: true }
        prunedAt: { type: string, format: date-time, nullable: true }
    RequestLogEntry:
      type: object
      additionalProperties: false
      required: [id, at, source, method, path, query, status, durationMs, productId, productName, apiKeyId, userId, tenantId, tenantName, externalId, ip, userAgent, error]
      properties:
        id: { type: string, example: '1042' }
        at: { type: string, format: date-time }
        source: { type: string, enum: [v1, admin, account], description: 'account: a change a signed-in customer made from the dashboard.' }
        method: { type: string, example: POST }
        path: { type: string, example: /v1/tenants }
        query: { type: string, nullable: true, description: The query string without its '?'. }
        status: { type: integer }
        durationMs: { type: integer }
        productId: { type: string, format: uuid, nullable: true, description: Null for admin calls and failed sign-ins. }
        productName: { type: string, nullable: true }
        apiKeyId: { type: string, format: uuid, nullable: true }
        userId: { type: string, format: uuid, nullable: true, description: The signed-in person who made the call, for calls made from the dashboard by a customer. }
        tenantId: { type: string, format: uuid, nullable: true, description: The store in the path or the tenantId parameter. }
        tenantName: { type: string, nullable: true, description: Null once the store is deleted. }
        externalId: { type: string, nullable: true, description: The externalId parameter, when given. }
        ip: { type: string, nullable: true }
        userAgent: { type: string, nullable: true }
        error: { type: string, nullable: true, description: The error message of a 4xx or 5xx response. }
    Page:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    TenantRow:
      type: object
      additionalProperties: false
      required: [id, externalId, name, productId, productName, versionId, versionName, mainDomain, domainCount, statusCode, statusName, isSuspended, latestBackupAt, dateCreated]
      properties:
        id: { type: string, format: uuid }
        externalId: { type: string }
        name: { type: string }
        productId: { type: string, format: uuid }
        productName: { type: string }
        versionId: { type: string, format: uuid }
        versionName: { type: string }
        mainDomain: { type: string, nullable: true }
        domainCount: { type: integer }
        statusCode: { type: integer, minimum: 0, maximum: 3 }
        statusName: { type: string }
        isSuspended: { type: boolean }
        latestBackupAt: { type: string, format: date-time, nullable: true }
        dateCreated: { type: string, format: date-time }
    TenantDetail:
      type: object
      additionalProperties: false
      required: [id, externalId, name, productId, productName, versionId, versionName, statusCode, statusName, isSuspended, domains, backups, recentJobs, failures, wpOptionNames, phpConstantNames]
      properties:
        id: { type: string, format: uuid }
        externalId: { type: string }
        name: { type: string }
        productId: { type: string, format: uuid }
        productName: { type: string }
        versionId: { type: string, format: uuid }
        versionName: { type: string }
        snapshotName: { type: string }
        snapshotGroupName: { type: string, nullable: true }
        statusCode: { type: integer, minimum: 0, maximum: 3 }
        statusName: { type: string }
        isSuspended: { type: boolean }
        dateSuspended: { type: string, format: date-time, nullable: true }
        dateCreated: { type: string, format: date-time }
        dateChanged: { type: string, format: date-time }
        wpOptionNames: { type: array, items: { type: string }, description: Names only; values can be secret. }
        phpConstantNames: { type: array, items: { type: string }, description: Names only; values can be secret. }
        domains:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, domainName, isMainDomain, isBaseDomain]
            properties:
              id: { type: string, format: uuid }
              domainName: { type: string }
              isMainDomain: { type: boolean }
              isBaseDomain: { type: boolean }
        backups: { type: array, items: { $ref: '#/components/schemas/Backup' } }
        recentJobs: { type: array, items: { $ref: '#/components/schemas/Job' } }
        failures: { type: array, items: { $ref: '#/components/schemas/JobFailure' } }
    Backup:
      type: object
      additionalProperties: false
      required: [id, tenantId, externalId, productId, reason, sizeBytes, statusCode, statusName, dateCreated, tenantDeletedAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        externalId: { type: string }
        productId: { type: string, format: uuid }
        reason: { type: string, enum: [manual, suspend, scheduled, before-restore] }
        sizeBytes: { type: integer, nullable: true }
        statusCode: { type: integer, minimum: 0, maximum: 3 }
        statusName: { type: string }
        dateCreated: { type: string, format: date-time }
        tenantDeletedAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true, description: When the backup is purged; null while its tenant exists. }
    JobTarget:
      type: object
      required: [type, tenantId, versionId, backupId, baseSnapshotId]
      properties:
        type: { type: string, example: tenant.create }
        tenantId: { type: string, format: uuid, nullable: true }
        versionId: { type: string, format: uuid, nullable: true }
        backupId: { type: string, format: uuid, nullable: true }
        baseSnapshotId: { type: string, format: uuid, nullable: true }
    Job:
      allOf:
        - $ref: '#/components/schemas/JobTarget'
        - type: object
          required: [id, state, attempts, createdOn]
          properties:
            id: { type: string, format: uuid }
            state: { type: string, enum: [created, retry, active, completed, cancelled, failed] }
            attempts: { type: integer }
            createdOn: { type: string, format: date-time }
            startedOn: { type: string, format: date-time, nullable: true }
            startAfter: { type: string, format: date-time, nullable: true }
            completedOn: { type: string, format: date-time, nullable: true }
    JobFailure:
      allOf:
        - $ref: '#/components/schemas/JobTarget'
        - type: object
          required: [id, jobId, errorMessage, attempts, failedAt, status, retriedAt, retryJobId]
          properties:
            id: { type: string, format: uuid }
            jobId: { type: string, format: uuid }
            errorMessage: { type: string }
            attempts: { type: integer }
            failedAt: { type: string, format: date-time }
            status: { type: string, enum: [failed, retried] }
            retriedAt: { type: string, format: date-time, nullable: true }
            retryJobId: { type: string, format: uuid, nullable: true }
    PluginSlug: { type: string, enum: [wpcs-waas-host, wpcs-waas-client, waas-payments] }
    PluginInstall:
      type: object
      additionalProperties: false
      required: [productId, productName, slug, site, version, channel, wpVersion, phpVersion, firstSeen, lastSeen]
      properties:
        productId: { type: string, format: uuid }
        productName: { type: string }
        slug: { $ref: '#/components/schemas/PluginSlug' }
        site: { type: string, description: 'The site URL it reported; empty when it sent none' }
        version: { type: string }
        channel: { type: string, enum: [stable, beta] }
        wpVersion: { type: string, nullable: true }
        phpVersion: { type: string, nullable: true }
        firstSeen: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }
    PluginPin:
      type: object
      additionalProperties: false
      required: [productId, slug, version, pinnedAt]
      properties:
        productId: { type: string, format: uuid }
        slug: { $ref: '#/components/schemas/PluginSlug' }
        version: { type: string }
        pinnedAt: { type: string, format: date-time }
    WebhookEventType:
      type: string
      description: See openapi/webhooks.yaml.
      enum: [tenant.ready, tenant.updated, tenant.version_changed, tenant.domains_changed, tenant.suspended, tenant.resumed, tenant.deleted, tenant.restored, tenant.rolled_back, tenant.backup_completed, tenant.backup_failed, tenant.failed, version.ready, version.deleted, version.failed, webhook.test]
    WebhookEndpointParams:
      type: object
      properties:
        url: { type: string, example: 'https://hooks.example.com/waas' }
        description: { type: string, nullable: true, maxLength: 200 }
        eventTypes:
          description: Empty or left out is every event.
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }
        enabled: { type: boolean }
    WebhookEndpoint:
      type: object
      required: [id, url, description, eventTypes, enabled, dateCreated, dateChanged]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        description: { type: string, nullable: true }
        eventTypes:
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }
        enabled: { type: boolean }
        dateCreated: { type: string, format: date-time }
        dateChanged: { type: string, format: date-time }
    AdminWebhookEndpoint:
      allOf:
        - $ref: '#/components/schemas/WebhookEndpoint'
        - type: object
          required: [productId, productName, apiKeyId, last24Hours, pending, lastAttemptAt]
          properties:
            productId: { type: string, format: uuid }
            productName: { type: string }
            apiKeyId: { type: string, format: uuid, nullable: true, description: The API key that registered it; null when added here }
            last24Hours:
              type: object
              additionalProperties: false
              required: [sent, failed]
              properties:
                sent: { type: integer, description: Deliveries created in the last 24 hours }
                failed: { type: integer, description: Of those, how many failed after their retries }
            pending: { type: integer, description: Deliveries still being sent or retried }
            lastAttemptAt: { type: string, format: date-time, nullable: true }
    WebhookDelivery:
      type: object
      required: [id, eventId, eventType, endpointId, tenantId, versionId, status, attempts, responseStatus, responseBody, error, durationMs, dateCreated, lastAttemptAt]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        eventType: { $ref: '#/components/schemas/WebhookEventType' }
        endpointId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid, nullable: true }
        versionId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [pending, delivered, failed] }
        attempts: { type: integer }
        responseStatus: { type: integer, nullable: true }
        responseBody: { type: string, nullable: true }
        error: { type: string, nullable: true }
        durationMs: { type: integer, nullable: true }
        dateCreated: { type: string, format: date-time }
        lastAttemptAt: { type: string, format: date-time, nullable: true }
