openapi: 3.0.1
info:
  title: WaaS Provisioning API - admin
  version: 0.1.0
  description: >-
    Admin endpoints for the dashboard (waas-api-plu). The version
    and template endpoints under /admin/products/{productId} take the same requests and give the
    same responses as their /v1 operations (schemas referenced from openapi/waas-provisioning-api.yaml). They see every
    product. Authenticate with `Authorization: Bearer <ADMIN_TOKEN>`; anything else, product keys
    included, gets 403. When ADMIN_TOKEN is not set, every request gets 403.


    The same endpoints answer a signed-in customer at /account instead of /admin (docs/accounts.md),
    narrowed to their organization's product: lists hold only that product, another product's records
    are 404, and the platform-only endpoints (creating products, product limits, plugins, database
    backups, renaming the organization) are 404. Their own organization's members and invitations
    (the dashboard's Team page) are at /account/products/{productId}/....
servers:
  - url: http://localhost:4111
    description: Local
security:
  - adminToken: []
paths:
  /admin/overview:
    get:
      operationId: adminOverview
      summary: Counts, health and products
      parameters:
        - name: productId
          in: query
          description: Counts for this storefront only. The product list still holds every product.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Overview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/products:
    get:
      operationId: adminListProducts
      summary: Products (storefronts)
      responses:
        '200':
          description: All products, by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Product' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: adminCreateProduct
      summary: A new product (a seller's storefront) with its first API key
      description: >-
        The key's secret is in this response only (Cache-Control no-store); hand it to the seller
        once. They can then manage their own keys at /v1/keys (openapi/api-keys.yaml).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                maxTenants: { type: integer, minimum: 0, nullable: true }
                keyLabel: { type: string, maxLength: 100, nullable: true }
                startFrom:
                  type: string
                  format: uuid
                  nullable: true
                  description: >-
                    Another storefront whose production version and newest template the new one
                    starts with, as its production version, so stores can be made as soon as it has
                    built. 400 when that storefront has none ready.
      responses:
        '201':
          description: The product and its first key with the secret
          content:
            application/json:
              schema:
                type: object
                required: [product, key]
                additionalProperties: false
                properties:
                  product: { $ref: '#/components/schemas/Product' }
                  key: { $ref: '../api-keys.yaml#/components/schemas/NewApiKey' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/products/{productId}/keys:
    parameters:
      - $ref: '#/components/parameters/productId'
    get:
      operationId: adminListApiKeys
      summary: A product's API keys
      description: Working keys and keys revoked in the last 30 days, newest first. Never secrets.
      responses:
        '200':
          description: Keys
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '../api-keys.yaml#/components/schemas/ApiKeyInfo' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: adminCreateApiKey
      summary: Create a key for a product (same rules as createApiKey)
      requestBody:
        content:
          application/json:
            schema: { $ref: '../api-keys.yaml#/components/schemas/CreateApiKey' }
      responses:
        '201':
          description: The new key with its secret, shown this once
          content:
            application/json:
              schema: { $ref: '../api-keys.yaml#/components/schemas/NewApiKey' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/products/{productId}/storefront:
    parameters:
      - $ref: '#/components/parameters/productId'
    get:
      operationId: adminGetStorefront
      summary: A product's ready-made storefront
      description: The WordPress site with WaaS Host the platform built for this product, or null when it has none.
      responses:
        '200':
          description: The storefront (a store of the storefront product), or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '../waas-provisioning-api.yaml#/components/schemas/GetTenantQueryResult'
                  - type: 'null'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: adminCreateStorefront
      summary: Build a ready-made storefront for a product
      description: >-
        Platform admin only. Builds a WordPress site with WaaS Host from the storefront product's production version
        (STOREFRONT_PRODUCT_ID) and connects it to this product: a new API key labelled "Ready-made storefront" is made,
        and its key, secret and the API's address are written into the site's wp-config. The secret is never answered.
        The site's owner signs in to WordPress with a password reset. One per product.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name: { type: string, maxLength: 100, description: The site's title }
                email: { type: string, format: email, description: 'The owner: WordPress administrator and admin email' }
                subdomain:
                  type: string
                  pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
                  description: The site answers on <subdomain>.<platform domain>. Without it, only on its generated base domain
      responses:
        '201':
          description: The storefront, being built
          content:
            application/json:
              schema: { $ref: '../waas-provisioning-api.yaml#/components/schemas/GetTenantQueryResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/products/{productId}/keys/{id}/rotate:
    parameters:
      - $ref: '#/components/parameters/productId'
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: adminRotateApiKey
      summary: Replace an active key (same rules as rotateApiKey)
      requestBody:
        content:
          application/json:
            schema: { $ref: '../api-keys.yaml#/components/schemas/RotateApiKey' }
      responses:
        '201':
          description: The new key with its secret, shown this once, and the key it replaces
          content:
            application/json:
              schema: { $ref: '../api-keys.yaml#/components/schemas/RotatedApiKey' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/products/{productId}/keys/{id}:
    parameters:
      - $ref: '#/components/parameters/productId'
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: adminRevokeApiKey
      summary: Revoke a key now
      description: Like revokeApiKey, except the product's last active key can be revoked, to cut a storefront off.
      responses:
        '200':
          description: The revoked key
          content:
            application/json:
              schema: { $ref: '../api-keys.yaml#/components/schemas/ApiKeyInfo' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/products/{productId}:
    parameters:
      - $ref: '#/components/parameters/productId'
    put:
      operationId: adminUpdateProduct
      summary: A product's settings (name, maxTenants)
      description: >-
        Send either or both; fields left out stay. name renames the product (1 to 100 characters).
        maxTenants is the most tenants the product may have (null: no limit). At the limit,
        createTenant and restoreTenant answer 400. Lowering it below the current count deletes
        nothing; it only stops new tenants.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                maxTenants: { type: integer, minimum: 0, nullable: true }
      responses:
        '200':
          description: The product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: adminDeleteProduct
      summary: Delete a product with no stores
      description: >-
        Removes the product with its keys, versions, templates and settings. Answers 409 while it has
        stores or a ready-made storefront, and for the product that hosts the ready-made storefronts.
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/products/{productId}/organization:
    parameters:
      - $ref: '#/components/parameters/productId'
    get:
      operationId: adminGetOrganization
      summary: A product's organization, its members and pending invitations (docs/accounts.md)
      description: organization is null until one is made (PUT) or someone is invited.
      responses:
        '200':
          description: The organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationView' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: adminPutOrganization
      summary: Make the product's organization, or rename it
      description: Each product has at most one organization. name defaults to the product's name.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { name: { type: string, minLength: 1, maxLength: 100 } }
      responses:
        '200':
          description: Renamed (or already there)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationView' }
        '201':
          description: Made
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/products/{productId}/branding:
    parameters:
      - $ref: '#/components/parameters/productId'
    get:
      operationId: adminGetProductBranding
      summary: A storefront's own look in the dashboard (docs/branding.md)
      description: >-
        The fields set here (null when not set). shown is what the dashboard shows: for a storefront,
        each empty field filled from its reseller's branding.
      responses:
        '200':
          description: The branding
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandingView' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: adminPutProductBranding
      summary: Set some of the name, main color and support email
      description: Fields left out stay as they are; null or an empty string clears one.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 60, nullable: true }
                color: { type: string, pattern: '^#[0-9a-fA-F]{6}$', nullable: true, example: '#1d4ed8' }
                supportEmail: { type: string, format: email, nullable: true }
      responses:
        '200':
          description: The branding
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandingView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/products/{productId}/branding/{kind}:
    parameters:
      - $ref: '#/components/parameters/productId'
      - { name: kind, in: path, required: true, schema: { type: string, enum: [logo, icon] } }
    put:
      operationId: adminPutProductBrandingImage
      summary: Upload the logo (up to 256 KB) or the icon (up to 64 KB)
      description: >-
        The image is the request body: PNG, JPEG or WebP, or an .ico file for the icon. The type is
        read from the file itself; SVG is refused.
      requestBody:
        required: true
        content:
          image/*:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: The branding
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandingView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: adminDeleteProductBrandingImage
      summary: Remove the logo or the icon
      responses:
        '200':
          description: The branding
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandingView' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/products/{productId}/dashboard-domain:
    parameters:
      - $ref: '#/components/parameters/productId'
    get:
      operationId: adminGetDashboardDomain
      summary: The storefront's own dashboard address, if it has one (docs/branding.md)
      description: enabled is false when this server doesn't offer own addresses (DASHBOARD_DOMAINS unset).
      responses:
        '200':
          description: The address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardDomainView' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: adminPutDashboardDomain
      summary: Set the storefront's own dashboard address, replacing the one before
      description: >-
        An address under the seller's own domain, like dashboard.yourbusiness.com. It is added to the
        dashboard's host at once; records lists the DNS records still to add. 503 when this server doesn't
        offer own addresses. At /account, a client's storefront gets 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties: { domain: { type: string, example: dashboard.janedesigns.com } }
      responses:
        '200':
          description: The address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardDomainView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: adminDeleteDashboardDomain
      summary: Stop using the storefront's own dashboard address
      responses:
        '200':
          description: The address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardDomainView' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/products/{productId}/dashboard-domain/check:
    parameters:
      - $ref: '#/components/parameters/productId'
    post:
      operationId: adminCheckDashboardDomain
      summary: Ask the host to check the address's DNS again
      description: Also done nightly for every address still pending. A failed check leaves its reason in error.
      responses:
        '200':
          description: The address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardDomainView' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/products/{productId}/invitations:
    parameters:
      - $ref: '#/components/parameters/productId'
    post:
      operationId: adminInvite
      summary: Invite someone to the product's organization by email
      description: >-
        Makes the organization if there is none yet, and emails the invitation through toSend when
        sign-in email is set up (emailed says whether it went). The person signs in with that email
        address and accepts at acceptUrl within 7 days. A new invitation for the same address replaces
        a pending one. role defaults to owner here and to member at /account, where only an owner may
        invite an owner. 503 when sign-in is off (AUTH_URL and AUTH_SECRET unset).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                role: { $ref: '#/components/schemas/OrganizationRole' }
      responses:
        '201':
          description: The invitation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/products/{productId}/invitations/{id}:
    parameters:
      - $ref: '#/components/parameters/productId'
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: adminCancelInvitation
      summary: Cancel a pending invitation
      responses:
        '200':
          description: The organization after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationView' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/products/{productId}/members/{id}:
    parameters:
      - $ref: '#/components/parameters/productId'
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: adminRemoveMember
      summary: Remove someone from the product's organization
      description: >-
        Their account stays; it can no longer reach this product. At /account nobody removes
        themselves, only an owner removes an owner, and the last owner stays (403).
      responses:
        '200':
          description: The organization after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationView' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: adminSetMemberRole
      summary: Change someone's role in the product's organization
      description: >-
        Owners and admins may make changes; members may only look. At /account nobody changes their
        own role and only an owner gives or takes the owner role. 409 when it would leave no owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/OrganizationRole' }
      responses:
        '200':
          description: The organization after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/products/{productId}/versions:
    parameters:
      - $ref: '#/components/parameters/productId'
    get:
      operationId: adminListVersions
      summary: A product's versions (as listVersions)
      parameters:
        - { name: versionId, in: query, schema: { type: string, format: uuid } }
        - { name: versionName, in: query, schema: { type: string } }
      responses:
        '200':
          description: Same response as GET /v1/versions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '../waas-provisioning-api.yaml#/components/schemas/GetVersionQueryResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: adminCreateVersion
      summary: Create a version for a product (as createVersion)
      requestBody:
        content:
          application/json:
            schema: { $ref: '../waas-provisioning-api.yaml#/components/schemas/CreateVersionParams' }
      responses:
        '200':
          description: Same response as POST /v1/versions
          content:
            application/json:
              schema: { $ref: '../waas-provisioning-api.yaml#/components/schemas/CreateVersionCommandResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/products/{productId}/versions/{id}:
    parameters:
      - $ref: '#/components/parameters/productId'
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: adminDeleteVersion
      summary: Remove a non-production version (as deleteVersion)
      responses:
        '200':
          description: Removal scheduled; no body, as DELETE /v1/versions
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/products/{productId}/versions/{id}/production:
    parameters:
      - $ref: '#/components/parameters/productId'
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: adminSetProductionVersion
      summary: Make a version the product's production version (as setProductionVersion)
      responses:
        '200':
          description: Same response as PUT /v1/versions/production
          content:
            application/json:
              schema: { $ref: '../waas-provisioning-api.yaml#/components/schemas/SetProductionVersionCommandResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/products/{productId}/basesnapshots:
    parameters:
      - $ref: '#/components/parameters/productId'
    get:
      operationId: adminListBaseSnapshots
      summary: A product's templates (as listBaseSnapshotsTemplates)
      parameters:
        - { name: baseSnapshotId, in: query, schema: { type: string, format: uuid } }
        - { name: name, in: query, schema: { type: string } }
        - { name: groupName, in: query, schema: { type: string } }
      responses:
        '200':
          description: Same response as GET /v1/basesnapshots
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '../waas-provisioning-api.yaml#/components/schemas/GetBaseSnapshotsQueryResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: adminCreateBaseSnapshot
      summary: Create a template for a product (as createBaseSnapshotTemplateUpload)
      requestBody:
        content:
          application/json:
            schema: { $ref: '../waas-provisioning-api.yaml#/components/schemas/CreateBaseSnapshotParams' }
      responses:
        '200':
          description: Same response as POST /v1/basesnapshots
          content:
            application/json:
              schema: { $ref: '../waas-provisioning-api.yaml#/components/schemas/CreateBaseSnapshotCommandResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: adminDeleteBaseSnapshot
      summary: Delete a template (as deleteBaseSnapshot)
      parameters:
        - { name: id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Same response as DELETE /v1/basesnapshots
          content:
            application/json:
              schema: { $ref: '../waas-provisioning-api.yaml#/components/schemas/RemoveBaseSnapshotCommandResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/tenants:
    get:
      operationId: adminListTenants
      summary: Tenants across all products
      parameters:
        - { name: productId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: integer, minimum: 0, maximum: 3 } }
        - { name: suspended, in: query, schema: { type: boolean } }
        - { name: versionId, in: query, schema: { type: string, format: uuid } }
        - name: q
          in: query
          description: 'Matches external id, name or any domain (case-insensitive substring).'
          schema: { type: string }
        - name: across
          in: query
          description: 'Only at /account/tenants: `reseller` lists the stores of every storefront in the signed-in reseller team''s account, ignoring the picked storefront. Ignored for anyone else.'
          schema: { type: string, enum: [reseller] }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: One page of tenants, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/TenantRow' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/tenants/{id}:
    get:
      operationId: adminGetTenant
      summary: One tenant with domains, backups, recent jobs and failures
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: adminDeleteTenant
      summary: Delete a store
      description: >-
        Removes the store, as the storefront's deleteTenant does: the tenant is Removing until the
        job finishes, then it is gone and tenant.deleted is sent to the storefront's webhooks. Its
        backups are kept for the retention period, so it can still be brought back. Platform admin
        only; a signed-in customer gets 404. A store already being removed is left as it is.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The deletion was scheduled
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [tenantId, externalId]
                properties:
                  tenantId: { type: string, format: uuid }
                  externalId: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/tenants/{id}/suspend:
    post:
      operationId: adminSuspendTenant
      summary: Take a store offline
      description: >-
        Suspends the store, as the storefront's suspendTenant does: visitors see the "website
        unavailable" page until it is resumed. Unless takeBackup is false it is backed up first
        (reason suspend; its id is backupId). A suspended store is left as it is and backupId is
        null. Platform admin only. 400 when the tenant is Removing or Failed.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                takeBackup: { type: boolean, default: true, description: Back up the store before taking it offline. }
      responses:
        '200': { $ref: '#/components/responses/TenantLifecycle' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/tenants/{id}/resume:
    post:
      operationId: adminResumeTenant
      summary: Bring a suspended store back online
      description: >-
        Resumes the store, as the storefront's resumeTenant does. A store that isn't suspended is
        left as it is. Platform admin only. 400 when the tenant is Removing or Failed.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/TenantLifecycle' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/tenants/{id}/domains/main:
    put:
      operationId: adminSetTenantMainDomain
      summary: Make a domain the store's main address
      description: >-
        Adds the domain if the tenant doesn't have it yet and makes it the main domain, like
        addTenantDomain with setAsMainDomain, for any product. The old main domain stays as a
        redirect. The tenant is Pending until the domain job finishes. 400 when the domain is
        invalid or taken, or the tenant is Removing or Failed.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domainName]
              properties:
                domainName: { type: string }
      responses:
        '200':
          description: The domain now being applied as main
          content:
            application/json:
              schema:
                type: object
                required: [tenantId, externalId, domain, setAsMainDomain]
                properties:
                  tenantId: { type: string, format: uuid }
                  externalId: { type: string }
                  domain: { type: string }
                  setAsMainDomain: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/tenants/{id}/domain-connect:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getStoreDomainConnect
      summary: A link that adds the store's DNS records at the domain's DNS host (Domain Connect)
      description: >-
        service website gives the domain's A record (one of the store's domains); email gives its
        sending domain's DKIM, MX and SPF records. 400 when the domain isn't the store's or Domain
        Connect is off.
      parameters:
        - { name: domainName, in: query, required: true, schema: { type: string } }
        - { name: service, in: query, required: true, schema: { type: string, enum: [website, email] } }
      responses:
        '200':
          description: The link, when the DNS host supports it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainConnectLink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/products/{productId}/imports:
    post:
      operationId: adminCreateImport
      summary: Make a store that waits for a site moved in from another host
      description: >-
        Creates a store of the product with no template that waits for its site, and answers the
        import code to paste into the AnyPress Export plugin on the old site (works 7 days, until the
        move starts) and the plugin's download link. The store keeps the site's own plugins and
        themes. See docs/site-imports.md.
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                size: { type: string, enum: [small, medium, large] }
                customDomainName: { type: string }
      responses:
        '200':
          description: The store waits for its site
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportCode' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/products/{productId}/tenants:
    post:
      operationId: adminCreateTenant
      summary: Make a new store of the product
      description: >-
        Builds a store from the product's production version and its latest template, as
        POST /v1/tenants does, without the storefront or an API key: the dashboard's "New site".
        Counts toward the product's store limit (and its reseller's).
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                size: { type: string, enum: [small, medium, large] }
                customDomainName: { type: string, description: 'Its own address; default <label>.<platform domain>' }
      responses:
        '201':
          description: The store is being built
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [tenantId, externalId]
                properties:
                  tenantId: { type: string, format: uuid }
                  externalId: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/tenants/{id}/import-code:
    post:
      operationId: adminRenewImportCode
      summary: A new import code for a store waiting for its site
      description: The code given before stops working. 400 when the store isn't waiting for a site.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The new code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportCode' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/tenants/{id}/restore:
    post:
      operationId: adminRestoreTenant
      summary: Roll a live store back to one of its backups
      description: >-
        Replaces the store's files and database with one of its own Done backups, in place. The
        store keeps its current domains, version, PHP constants and suspension, and the tenant's
        current wpOptions are written again afterwards. Unless takeBackup is false, what the store
        holds now is backed up first (reason before-restore; its id is safetyBackupId), so the
        rollback can be undone by restoring that backup. The tenant is Pending until the job
        finishes. If that first backup fails the store is left untouched and Done. 400 when the
        backup is not a Done backup of this tenant, or the tenant is Removing or Failed.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [backupId]
              properties:
                backupId: { type: string, format: uuid }
                takeBackup: { type: boolean, default: true, description: Back up what the store holds now first. }
      responses:
        '200':
          description: The rollback was scheduled
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [tenantId, externalId, backupId, safetyBackupId]
                properties:
                  tenantId: { type: string, format: uuid }
                  externalId: { type: string }
                  backupId: { type: string, format: uuid }
                  safetyBackupId: { type: string, format: uuid, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/tenants/{id}/mail-domain:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: adminGetTenantMailDomain
      summary: The store's own sending domain
      description: >-
        The domain the store sends email from instead of the platform's address, with the DNS
        records its owner adds at their DNS host. null when it sends from the platform's address.
      responses:
        '200':
          description: The sending domain, or null
          content:
            application/json:
              schema:
                type: object
                required: [mailDomain]
                properties:
                  mailDomain: { anyOf: [{ $ref: '#/components/schemas/MailDomain' }, { type: object, nullable: true, enum: [null] }] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: adminSetTenantMailDomain
      summary: Give the store its own sending domain
      description: >-
        Adds the domain on toSend and returns the DNS records to add. The store keeps sending from
        the platform's address until toSend has verified the records (it checks every 10 minutes),
        then sends from no-reply (STORE_MAIL_FROM's name) at the domain. Setting the domain the
        store already has returns it. 400 when the domain is invalid, the platform's, another
        store's or on another toSend account, when the store already has a different one, or when
        TOSEND_ADMIN_KEY is not set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domainName]
              properties:
                domainName: { type: string }
      responses:
        '200':
          description: The sending domain
          content:
            application/json:
              schema:
                type: object
                required: [mailDomain]
                properties:
                  mailDomain: { $ref: '#/components/schemas/MailDomain' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: adminRemoveTenantMailDomain
      summary: Move the store back to the platform's address
      description: >-
        The domain's status becomes removing; within 10 minutes the store sends from the platform's
        address again and the domain leaves toSend. The owner's DNS records are not touched.
      responses:
        '200':
          description: The domain being removed
          content:
            application/json:
              schema:
                type: object
                required: [domainName]
                properties:
                  domainName: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/backups:
    get:
      operationId: adminListBackups
      summary: Backups across all products, including deleted tenants'
      parameters:
        - { name: productId, in: query, schema: { type: string, format: uuid } }
        - { name: tenantId, in: query, schema: { type: string, format: uuid } }
        - { name: externalId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: integer, minimum: 0, maximum: 3 } }
        - { name: tenantDeleted, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: One page of backups, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Backup' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/jobs:
    get:
      operationId: adminListJobs
      summary: Queued, running or failed jobs
      description: Failed means failed its last retry; those are kept in the job_failures table until retried or dismissed.
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [queued, running, failed], default: queued } }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: One page of jobs, with counts for every tab
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [state, counts, items]
                    properties:
                      state: { type: string, enum: [queued, running, failed] }
                      counts: { $ref: '#/components/schemas/JobCounts' }
                      items:
                        type: array
                        items:
                          oneOf:
                            - $ref: '#/components/schemas/Job'
                            - $ref: '#/components/schemas/JobFailure'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/plugins:
    get:
      operationId: adminListPluginInstalls
      summary: Plugin versions sites report, and pins
      description: >-
        Every site that has checked for an update of one of our plugins (waas-hw4), with the version
        it last reported, and the products pinned to a release.
      parameters:
        - { name: productId, in: query, schema: { type: string, format: uuid } }
        - { name: slug, in: query, schema: { $ref: '#/components/schemas/PluginSlug' } }
      responses:
        '200':
          description: Installs and pins
          content:
            application/json:
              schema:
                type: object
                required: [installs, pins]
                additionalProperties: false
                properties:
                  installs: { type: array, items: { $ref: '#/components/schemas/PluginInstall' } }
                  pins: { type: array, items: { $ref: '#/components/schemas/PluginPin' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/products/{productId}/plugins/{slug}/pin:
    parameters:
      - $ref: '#/components/parameters/productId'
      - { name: slug, in: path, required: true, schema: { $ref: '#/components/schemas/PluginSlug' } }
    put:
      operationId: adminPinPlugin
      summary: Hold a product's sites at one plugin release
      description: >-
        Its update checks get this release whatever their channel says. The release must exist in
        the releases bucket (400 otherwise). A site only installs it when it is newer than the
        version it runs, so a pin holds sites back but never downgrades them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties: { version: { type: string, example: 2.3.0 } }
      responses:
        '200':
          description: The pin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginPin' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      operationId: adminUnpinPlugin
      summary: Remove the pin; the sites follow their channel again
      responses:
        '200': { description: Removed (also when there was no pin) }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/db-backups:
    get:
      operationId: adminListDbBackups
      summary: Off-site backups of the API's own database
      description: >-
        The status /health reports, plus each backup attempt, newest first, with its object key in
        the bucket and the error when it failed. prunedAt is set once retention deleted the object.
        Restore runbook: docs/db-backups.md.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Backup status and one page of attempts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - $ref: '#/components/schemas/DbBackupStatus'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/DbBackup' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/requests:
    get:
      operationId: adminListRequests
      summary: The request log
      description: >-
        Every product API call (/v1/*, failed sign-ins included) and every admin change (any /admin
        request but a GET), newest first. Records who called what and how it went, never what was
        sent: no bodies, no secrets, no headers but the user agent. The API key is its id (the Basic
        auth username). Rows older than REQUEST_LOG_DAYS (default 30) are deleted daily; 0 turns the
        log off. At /account, and with productId, the log is one product's: its own calls and dashboard
        changes, plus failed sign-ins with one of its key ids.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - { name: productId, in: query, schema: { type: string, format: uuid } }
        - { name: tenantId, in: query, schema: { type: string, format: uuid } }
        - { name: source, in: query, schema: { type: string, enum: [v1, admin, account] } }
        - name: outcome
          in: query
          description: ok is below 400, client-error 4xx, server-error 5xx, error either.
          schema: { type: string, enum: [ok, client-error, server-error, error] }
        - { name: method, in: query, schema: { type: string, example: POST } }
        - { name: path, in: query, description: Matches any part of the path., schema: { type: string } }
        - { name: from, in: query, description: Only requests at or after this time., schema: { type: string, format: date-time } }
        - { name: to, in: query, description: Only requests before this time., schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Counts for the last 24 hours and one page of requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items, last24Hours, retentionDays]
                    properties:
                      last24Hours:
                        type: object
                        additionalProperties: false
                        required: [total, clientErrors, serverErrors]
                        properties:
                          total: { type: integer }
                          clientErrors: { type: integer }
                          serverErrors: { type: integer }
                      retentionDays: { type: integer }
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/RequestLogEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/jobs/failures/{id}/retry:
    post:
      operationId: adminRetryFailure
      summary: Re-queue a failed job
      description: >-
        Puts the record the job worked on back to Pending (Removing for a delete) and queues the same
        job again. Only from Failed, so newer changes are never overwritten; otherwise 400.
        Idempotent: retrying a retried failure returns it unchanged.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The failure record, now retried
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobFailure' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/jobs/failures/{id}/dismiss:
    post:
      operationId: adminDismissFailure
      summary: Dismiss a failed job without running it
      description: >-
        For a failure there is nothing left to retry for: its store or version is gone, or later runs made
        it good. The record is kept but no longer listed as failed or counted. Changes nothing else.
        Only from Failed; a retried failure gets 400. Idempotent: dismissing a dismissed failure returns it unchanged.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The failure record, now dismissed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobFailure' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /applications:
    post:
      operationId: submitApplication
      summary: Apply to sell websites on the platform
      description: >-
        Public, no authentication: the marketing site's application form sends it. Nothing is made until
        the platform admin approves it. The applicant gets an email saying it arrived, and the addresses in
        APPLICATION_NOTIFY_EMAILS get one linking to it on the dashboard. One application per email address
        may wait at a time, and the API takes a limited number per hour from everyone together.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewApplication' }
      responses:
        '201':
          description: Received, waiting for review
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [pending] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429':
          description: Too many applications this hour; try later
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /admin/applications:
    get:
      operationId: adminListApplications
      summary: Applications to sell, newest first (platform admin only)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, declined] } }
      responses:
        '200':
          description: Up to 200 applications
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Application' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/applications/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: adminGetApplication
      summary: One application (platform admin only)
      responses:
        '200':
          description: The application
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/applications/{id}/approve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: adminApproveApplication
      summary: Approve an application (platform admin only)
      description: >-
        Makes the seller's product, named after the business, with maxTenants stores; invites the applicant
        as its owner and emails them the link to sign in to the dashboard; and, when storefront is true
        (by default when they asked for one), builds its ready-made storefront. If the storefront can't be
        built, the approval stands and storefrontError says why. With reseller true it makes a reseller account
        named after the business instead (maxTenants stores across up to maxProducts storefronts), puts the
        product in it with no store limit of its own, and invites the applicant as the owner of the
        reseller's team. Needs sign-in on (AUTH_URL), else 503.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                maxTenants: { type: integer, minimum: 0, nullable: true, default: 3, description: The most stores it may have (across the reseller's storefronts for a reseller); null for no limit }
                storefront: { type: boolean, description: Build its ready-made storefront. Defaults to what the applicant asked for }
                reseller: { type: boolean, default: false, description: Approve as a reseller account instead of a seller }
                maxProducts: { type: integer, minimum: 0, nullable: true, default: 3, description: Reseller approvals only. The most storefronts the reseller may have; null for no limit }
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                type: object
                required: [application, productId, resellerId, invitation, storefront, storefrontError]
                properties:
                  application: { $ref: '#/components/schemas/Application' }
                  productId: { type: string, format: uuid }
                  resellerId: { type: string, format: uuid, nullable: true, description: The reseller account made, for a reseller approval }
                  invitation:
                    type: object
                    required: [id, acceptUrl, expiresAt, emailed]
                    properties:
                      id: { type: string, format: uuid }
                      acceptUrl: { type: string }
                      expiresAt: { type: string, format: date-time }
                      emailed: { type: boolean, description: When false, send acceptUrl to the applicant yourself }
                  storefront:
                    description: The storefront being built, or null
                    oneOf:
                      - $ref: '../waas-provisioning-api.yaml#/components/schemas/GetTenantQueryResult'
                      - type: 'null'
                  storefrontError: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503':
          description: Sign-in is off on this API
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /admin/applications/{id}/decline:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: adminDeclineApplication
      summary: Decline an application and email the applicant (platform admin only)
      responses:
        '200':
          description: Declined
          content:
            application/json:
              schema:
                type: object
                required: [application, emailed]
                properties:
                  application: { $ref: '#/components/schemas/Application' }
                  emailed: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/webhooks:
    get:
      operationId: adminListWebhooks
      summary: Every product's webhook endpoints, with how their deliveries went
      description: Secrets are never listed. See openapi/webhooks.yaml and docs/webhooks.md.
      parameters:
        - { name: productId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: By product name, then oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminWebhookEndpoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: adminCreateWebhook
      summary: Register an endpoint for a product
      description: Returns the signing secret, the only time it is shown.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEndpointParams'
                - type: object
                  required: [productId, url]
                  properties:
                    productId: { type: string, format: uuid }
      responses:
        '201':
          description: The endpoint with its secret
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/WebhookEndpoint'
                  - type: object
                    required: [secret]
                    properties:
                      secret: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/webhooks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: adminUpdateWebhook
      summary: Change an endpoint (turn it off or on, its URL or events)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEndpointParams' }
      responses:
        '200':
          description: The endpoint
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: adminDeleteWebhook
      summary: Remove an endpoint
      responses:
        '200':
          description: The endpoint removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpoint' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/webhooks/{id}/rotate-secret:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: adminRotateWebhookSecret
      summary: Give an endpoint a new signing secret; the old one stops working at once
      responses:
        '200':
          description: The endpoint with its new secret
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/WebhookEndpoint'
                  - type: object
                    required: [secret]
                    properties:
                      secret: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/webhooks/{id}/test:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: adminTestWebhook
      summary: Send a webhook.test event to this endpoint, enabled or not
      responses:
        '200':
          description: The delivery, pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDelivery' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/webhooks/deliveries:
    get:
      operationId: adminListWebhookDeliveries
      summary: Webhook deliveries across products, newest first
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - { name: productId, in: query, schema: { type: string, format: uuid } }
        - { name: endpointId, in: query, schema: { type: string, format: uuid } }
        - { name: tenantId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [pending, delivered, failed] } }
      responses:
        '200':
          description: One page of deliveries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/WebhookDelivery'
                            - type: object
                              required: [url, productId, productName, tenantName]
                              properties:
                                url: { type: string }
                                productId: { type: string, format: uuid }
                                productName: { type: string }
                                tenantName: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/webhooks/deliveries/{id}/retry:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: adminRetryWebhookDelivery
      summary: Send a delivery again (only once it was delivered or failed; otherwise 400)
      responses:
        '200':
          description: The delivery, pending again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDelivery' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/clients:
    get:
      operationId: adminListClients
      summary: Clients set up in one step
      description: >-
        People the platform admin gave a site to with Add client (docs/clients.md), newest first. Listing
        also makes the site of any client whose storefront has finished building. Platform admin only.
      responses:
        '200':
          description: All clients, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Client' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: adminCreateClient
      summary: Adds a client
      description: >-
        Makes the client's own storefront (one site), started from startFrom's production version and
        template (default: the storefront with the most stores). Once it has built, the client's site is
        made and the client is emailed an invitation as the storefront's owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, email]
              properties:
                name: { type: string, maxLength: 100, description: The client's name, also their storefront's and site's }
                email: { type: string, format: email }
                size: { type: string, enum: [small, medium, large], default: small }
                startFrom: { type: string, format: uuid, description: The storefront whose version and template the client starts with }
      responses:
        '201':
          description: The client, setting up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/resellers:
    get:
      operationId: adminListResellers
      summary: Reseller accounts
      description: >-
        Partners that sell stores from one or more storefronts and pay a wholesale price for every live
        store across them (docs/resellers.md). Platform admin only: 404 at /account.
      responses:
        '200':
          description: All resellers, by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Reseller' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: adminCreateReseller
      summary: A new reseller, optionally with storefronts moved into it
      description: >-
        productIds moves those storefronts into the new reseller in the same step ("Make reseller" on a
        storefront). A storefront that belongs to another reseller is 409 and nothing is made.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ResellerSettings'
                - type: object
                  required: [name]
                  properties:
                    productIds: { type: array, maxItems: 100, items: { type: string, format: uuid } }
      responses:
        '201':
          description: The reseller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reseller' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/resellers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: adminGetReseller
      summary: One reseller
      responses:
        '200':
          description: The reseller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reseller' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: adminUpdateReseller
      summary: A reseller's settings
      description: Changes only the fields sent. Lowering a limit below the current count removes nothing; it only stops new ones.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResellerSettings' }
      responses:
        '200':
          description: The reseller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reseller' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: adminDeleteReseller
      summary: Deletes a reseller with no storefronts
      description: 409 while it has storefronts. Its usage history is kept.
      responses:
        '200':
          description: The reseller as it was
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reseller' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/resellers/{id}/products/{productId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - $ref: '#/components/parameters/productId'
    put:
      operationId: adminAddResellerProduct
      summary: Moves a storefront into the reseller
      description: >-
        Within the reseller's maxProducts (400 at the limit). A storefront of another reseller is 409.
        Its live stores count for this reseller from now on.
      responses:
        '200':
          description: The reseller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reseller' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: adminRemoveResellerProduct
      summary: Moves a storefront out of the reseller
      description: The storefront is its own again; its stores stop counting for the reseller from now on.
      responses:
        '200':
          description: The reseller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reseller' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/resellers/{id}/keys:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: adminListPartnerKeys
      summary: A reseller's partner keys
      description: >-
        A partner key works on every storefront the reseller has; each /v1 call names one with the
        productId query. Working keys and keys revoked in the last 30 days, newest first. Never secrets.
      responses:
        '200':
          description: Keys
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '../api-keys.yaml#/components/schemas/ApiKeyInfo' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: adminCreatePartnerKey
      summary: Create a partner key (same rules as createApiKey)
      requestBody:
        content:
          application/json:
            schema: { $ref: '../api-keys.yaml#/components/schemas/CreateApiKey' }
      responses:
        '201':
          description: The new key with its secret, shown this once
          content:
            application/json:
              schema: { $ref: '../api-keys.yaml#/components/schemas/NewApiKey' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/resellers/{id}/keys/{keyId}/rotate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: keyId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: adminRotatePartnerKey
      summary: Replace an active partner key (same rules as rotateApiKey)
      requestBody:
        content:
          application/json:
            schema: { $ref: '../api-keys.yaml#/components/schemas/RotateApiKey' }
      responses:
        '201':
          description: The new key with its secret, shown this once, and the key it replaces
          content:
            application/json:
              schema: { $ref: '../api-keys.yaml#/components/schemas/RotatedApiKey' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/resellers/{id}/keys/{keyId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: keyId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: adminRevokePartnerKey
      summary: Revoke a partner key now
      responses:
        '200':
          description: The revoked key
          content:
            application/json:
              schema: { $ref: '../api-keys.yaml#/components/schemas/ApiKeyInfo' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/resellers/{id}/branding:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: adminGetResellerBranding
      summary: A reseller's own look in the dashboard (docs/branding.md)
      description: >-
        The fields set here (null when not set). shown is what the dashboard shows: for a storefront,
        each empty field filled from its reseller's branding.
      responses:
        '200':
          description: The branding
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandingView' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: adminPutResellerBranding
      summary: Set some of the name, main color and support email
      description: Fields left out stay as they are; null or an empty string clears one.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 60, nullable: true }
                color: { type: string, pattern: '^#[0-9a-fA-F]{6}$', nullable: true, example: '#1d4ed8' }
                supportEmail: { type: string, format: email, nullable: true }
      responses:
        '200':
          description: The branding
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandingView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/resellers/{id}/branding/{kind}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: kind, in: path, required: true, schema: { type: string, enum: [logo, icon] } }
    put:
      operationId: adminPutResellerBrandingImage
      summary: Upload the logo (up to 256 KB) or the icon (up to 64 KB)
      description: >-
        The image is the request body: PNG, JPEG or WebP, or an .ico file for the icon. The type is
        read from the file itself; SVG is refused.
      requestBody:
        required: true
        content:
          image/*:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: The branding
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandingView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: adminDeleteResellerBrandingImage
      summary: Remove the logo or the icon
      responses:
        '200':
          description: The branding
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandingView' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/resellers/{id}/organization:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: adminGetResellerOrganization
      summary: A reseller's team, its members and pending invitations (docs/resellers.md)
      description: >-
        Everyone on a reseller's team signs in to the dashboard and reaches every storefront the
        reseller has, with their role here. organization is null until one is made (PUT) or someone is invited.
      responses:
        '200':
          description: The organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationView' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: adminPutResellerOrganization
      summary: Make the reseller's team, or rename it
      description: Each reseller has at most one. name defaults to the reseller's name.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { name: { type: string, minLength: 1, maxLength: 100 } }
      responses:
        '200':
          description: Renamed (or already there)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationView' }
        '201':
          description: Made
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/resellers/{id}/invitations:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: adminInviteToReseller
      summary: Invite someone to the reseller's team by email (same rules as adminInvite)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                role: { $ref: '#/components/schemas/OrganizationRole' }
      responses:
        '201':
          description: The invitation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/resellers/{id}/invitations/{invitationId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: invitationId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: adminCancelResellerInvitation
      summary: Cancel a pending invitation to the reseller's team
      responses:
        '200':
          description: The organization after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationView' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/resellers/{id}/members/{memberId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: adminRemoveResellerMember
      summary: Remove someone from the reseller's team
      description: Their account stays; it can no longer reach the reseller's storefronts.
      responses:
        '200':
          description: The organization after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationView' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: adminSetResellerMemberRole
      summary: Change someone's role on the reseller's team (same rules as adminSetMemberRole)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/OrganizationRole' }
      responses:
        '200':
          description: The organization after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/resellers/{id}/usage:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: adminResellerUsage
      summary: Store-days per size, what the wholesale bill is counted from
      description: >-
        A store counts from when it first finished building, while it is not suspended or being
        removed, under the reseller its storefront belonged to at the time. A store live for all of a
        30-day month is 30 store-days. Recorded from the release that added resellers on.
      parameters:
        - { name: from, in: query, description: 'Start (ISO 8601); default the start of this month, UTC', schema: { type: string, format: date-time } }
        - { name: to, in: query, description: 'End, exclusive (ISO 8601); default the start of next month, UTC', schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Usage in the period
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResellerUsage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/resellers/{id}/bill:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: adminResellerBill
      summary: A month's wholesale bill
      description: >-
        Each store is charged its size's monthly list price less the wholesale discount, for the share
        of the calendar month (UTC) it was live: a store live all month pays the whole monthly price,
        one live 10 days of a 30-day month a third. Amounts are US cents, rounded per line.
      parameters:
        - { name: month, in: query, description: 'YYYY-MM; default last month', schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
      responses:
        '200':
          description: The bill
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResellerBill' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/resellers/{id}/invoices:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: adminResellerInvoices
      summary: The Stripe invoices sent for its monthly bills
      description: >-
        Newest month first. Open invoices are checked with Stripe first, so a paid one shows as paid.
        enabled is false while automatic invoices are off (STRIPE_SECRET_KEY not set).
      responses:
        '200':
          description: Its invoices
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResellerInvoices' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: adminSendResellerInvoice
      summary: Send a month's invoice now, or try a failed one again
      description: >-
        The 1st's run does this for every reseller with autoInvoice on. With a card on file Stripe
        charges it; otherwise Stripe emails the invoice to the billing email to pay online. A month
        already sent (or with nothing due) is answered as it is and never sent twice. A failure is
        answered with status failed and the error.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                month: { type: string, pattern: '^\d{4}-\d{2}$', description: 'YYYY-MM, a month that is over; default last month' }
      responses:
        '200':
          description: The month's invoice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResellerInvoice' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /account/reseller:
    get:
      operationId: accountReseller
      summary: The signed-in reseller team's own account
      description: >-
        For a member of a reseller's team, acting for one of its storefronts (session only, with
        X-Session-Auth: 1). The same as adminGetReseller without stripeCustomerId. Anyone else gets 404.
      responses:
        '200':
          description: The reseller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reseller' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /account/reseller/bill:
    get:
      operationId: accountResellerBill
      summary: The reseller team's bill for a month (as adminResellerBill)
      parameters:
        - { name: month, in: query, description: 'YYYY-MM; default last month', schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
      responses:
        '200':
          description: The bill
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResellerBill' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /account/reseller/invoices:
    get:
      operationId: accountResellerInvoices
      summary: The reseller team's Stripe invoices (as adminResellerInvoices)
      responses:
        '200':
          description: Its invoices
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResellerInvoices' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /account/reseller/keys:
    get:
      operationId: accountListPartnerKeys
      summary: The reseller team's partner keys (as adminListPartnerKeys)
      responses:
        '200':
          description: Keys
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '../api-keys.yaml#/components/schemas/ApiKeyInfo' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: accountCreatePartnerKey
      summary: Create a partner key; owners and admins only (as adminCreatePartnerKey)
      requestBody:
        content:
          application/json:
            schema: { $ref: '../api-keys.yaml#/components/schemas/CreateApiKey' }
      responses:
        '201':
          description: The new key with its secret, shown this once
          content:
            application/json:
              schema: { $ref: '../api-keys.yaml#/components/schemas/NewApiKey' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /account/reseller/keys/{keyId}/rotate:
    parameters:
      - { name: keyId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: accountRotatePartnerKey
      summary: Replace a partner key; owners and admins only (as adminRotatePartnerKey)
      requestBody:
        content:
          application/json:
            schema: { $ref: '../api-keys.yaml#/components/schemas/RotateApiKey' }
      responses:
        '201':
          description: The new key with its secret, shown this once, and the key it replaces
          content:
            application/json:
              schema: { $ref: '../api-keys.yaml#/components/schemas/RotatedApiKey' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /account/reseller/keys/{keyId}:
    parameters:
      - { name: keyId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: accountRevokePartnerKey
      summary: Revoke a partner key now; owners and admins only
      responses:
        '200':
          description: The revoked key
          content:
            application/json:
              schema: { $ref: '../api-keys.yaml#/components/schemas/ApiKeyInfo' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    adminToken: { type: http, scheme: bearer }
  parameters:
    productId: { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
    page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    pageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
  responses:
    TenantLifecycle:
      description: The change was scheduled
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [tenantId, externalId, backupId]
            properties:
              tenantId: { type: string, format: uuid }
              externalId: { type: string }
              backupId: { type: string, format: uuid, nullable: true, description: The backup taken first; null when none was. }
    BadRequest:
      description: Invalid request
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Missing or wrong admin token
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Refused in the record's current state
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unavailable:
      description: Plugin updates are not configured (RELEASES_S3_BUCKET unset)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    NewApplication:
      type: object
      required: [name, email, business, clients, expectedSites, wantsStorefront]
      properties:
        name: { type: string, maxLength: 100, description: The applicant's name }
        email: { type: string, format: email, maxLength: 254, description: They sign in with this address once approved }
        business: { type: string, maxLength: 100, description: The business that sells; the product is named after it }
        website: { type: string, maxLength: 300, description: Their website, if they have one }
        clients: { type: string, maxLength: 1000, description: Who they sell websites to }
        expectedSites: { type: string, enum: ['1-2', '3-9', '10-24', '25+'], description: Websites they expect to sell in their first year }
        wantsStorefront: { type: boolean, description: They have no WordPress site to sell from and want a ready-made storefront }
        storefrontSubdomain:
          type: string
          pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
          description: With wantsStorefront, the storefront's address <subdomain>.<platform domain>. Must be free
    Application:
      type: object
      required: [id, name, email, business, website, clients, expectedSites, wantsStorefront, storefrontSubdomain, status, productId, resellerId, dateDecided, dateCreated]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        business: { type: string }
        website: { type: string, nullable: true }
        clients: { type: string }
        expectedSites: { type: string, enum: ['1-2', '3-9', '10-24', '25+'] }
        wantsStorefront: { type: boolean }
        storefrontSubdomain: { type: string, nullable: true }
        status: { type: string, enum: [pending, approved, declined] }
        productId: { type: string, format: uuid, nullable: true, description: The product made when it was approved }
        resellerId: { type: string, format: uuid, nullable: true, description: The reseller account made when it was approved as a reseller }
        dateDecided: { type: string, format: date-time, nullable: true }
        dateCreated: { type: string, format: date-time }
    OrganizationRole:
      type: string
      enum: [owner, admin, member]
      default: owner
      description: Owners and admins may make changes; members may only look.
    Invitation:
      type: object
      required: [id, email, role, expiresAt, dateCreated, acceptUrl]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: '#/components/schemas/OrganizationRole' }
        expiresAt: { type: string, format: date-time }
        dateCreated: { type: string, format: date-time }
        acceptUrl: { type: string, nullable: true, description: 'Where the person accepts: AUTH_URL/invite/<id>. null when sign-in is off.' }
        emailed: { type: boolean, description: 'Only when just made: whether the invitation was emailed. When false, send acceptUrl yourself.' }
    Branding:
      type: object
      required: [name, color, supportEmail, logoUrl, iconUrl]
      properties:
        name: { type: string, nullable: true, description: "The name in place of the platform's" }
        color: { type: string, nullable: true, description: 'Main color, #rrggbb' }
        supportEmail: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true, description: 'Public address of the logo (GET /branding/{id}/logo)' }
        iconUrl: { type: string, nullable: true, description: Public address of the small icon, for the browser tab }
    BrandingView:
      allOf:
        - $ref: '#/components/schemas/Branding'
        - type: object
          required: [shown]
          properties:
            shown: { $ref: '#/components/schemas/Branding' }
    DashboardDomainView:
      type: object
      required: [enabled, dashboardDomain]
      properties:
        enabled: { type: boolean }
        dashboardDomain:
          type: object
          nullable: true
          required: [domain, status, records, error, checkedAt]
          properties:
            domain: { type: string }
            status: { type: string, enum: [pending, active], description: 'active: the host serves it with a certificate' }
            records:
              type: array
              description: DNS records still to add at the domain's DNS host; empty once nothing is missing.
              items:
                type: object
                required: [type, name, value]
                properties:
                  type: { type: string, enum: [CNAME, A, TXT] }
                  name: { type: string, description: Full hostname; most DNS hosts want only the part before their domain }
                  value: { type: string }
            error: { type: string, nullable: true, description: Why the last check failed }
            checkedAt: { type: string, format: date-time, nullable: true }
    OrganizationView:
      type: object
      required: [organization, members, invitations]
      properties:
        organization:
          type: object
          nullable: true
          required: [id, name, dateCreated]
          description: A storefront's own team has productId; a reseller's team has resellerId.
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            productId: { type: string, format: uuid }
            resellerId: { type: string, format: uuid }
            dateCreated: { type: string, format: date-time }
        members:
          type: array
          items:
            type: object
            required: [id, userId, name, email, role, dateCreated]
            properties:
              id: { type: string, format: uuid }
              userId: { type: string, format: uuid }
              name: { type: string }
              email: { type: string }
              role: { $ref: '#/components/schemas/OrganizationRole' }
              dateCreated: { type: string, format: date-time }
        invitations:
          type: array
          items: { $ref: '#/components/schemas/Invitation' }
    DomainConnectLink:
      type: object
      description: >-
        A link that sends the store owner to their DNS host, which adds the records once they approve
        (docs/domain-connect.md). Without one (the DNS host doesn't support Domain Connect or hasn't
        accepted the platform's template yet), show the records to copy by hand.
      required: [dnsProvider, supported, url]
      properties:
        dnsProvider: { type: string, nullable: true, description: The domain's DNS host, when it supports Domain Connect at all, example: Cloudflare }
        supported: { type: boolean, description: True when url works }
        url: { type: string, nullable: true }
        conflict: { type: string, description: "Set when there is no link though the DNS host has the template: the domain already has a record the host would keep beside the template's (an older DKIM key), or the stores' IPv6 address is unknown; show it with the records to edit by hand" }
    MailDomain:
      type: object
      required: [domainName, status, dateCreated, dateVerified, records]
      properties:
        domainName: { type: string }
        status: { type: string, enum: [pending, verified, removing] }
        dateCreated: { type: string, format: date-time }
        dateVerified: { type: string, format: date-time, nullable: true }
        records:
          description: The records to add at the domain's DNS host; null when toSend could not be reached.
          type: array
          nullable: true
          items:
            type: object
            required: [type, name, host, value, priority]
            properties:
              type: { type: string }
              name: { type: string, description: 'Relative to the domain, as most DNS hosts want it' }
              host: { type: string, description: The full hostname }
              value: { type: string }
              priority: { type: integer, nullable: true }
    Product:
      type: object
      additionalProperties: false
      required: [id, name, tenantCount, maxTenants, versionCount, productionVersionId, resellerId, resellerName, dateCreated]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        tenantCount: { type: integer }
        maxTenants: { type: integer, nullable: true, description: 'The most tenants it may have; null is no limit' }
        versionCount: { type: integer }
        productionVersionId: { type: string, format: uuid, nullable: true }
        resellerId: { type: string, format: uuid, nullable: true, description: 'The reseller it belongs to; null for its own' }
        resellerName: { type: string, nullable: true }
        dateCreated: { type: string, format: date-time }
    StoreDays:
      type: object
      additionalProperties: false
      required: [small, medium, large]
      properties:
        small: { type: number }
        medium: { type: number }
        large: { type: number }
    ResellerSettings:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        maxProducts: { type: integer, minimum: 0, nullable: true, description: 'Storefronts it may have; null is no limit' }
        maxTenants: { type: integer, minimum: 0, nullable: true, description: 'Stores across all its storefronts; null is no limit' }
        wholesalePercent: { type: integer, minimum: 0, maximum: 100, description: 'Discount off list price on its bill (default 40)' }
        billingEmail: { type: string, format: email, nullable: true }
        brandName: { type: string, maxLength: 60, nullable: true, description: 'Shown with brandUrl on the "website unavailable" page of its suspended stores, instead of the platform''s name' }
        brandUrl: { type: string, maxLength: 500, pattern: '^https?://', nullable: true }
        stripeCustomerId: { type: string, pattern: '^cus_', nullable: true, description: 'Its Stripe customer, to bill an existing one; made from billingEmail on the first invoice when null' }
        autoInvoice: { type: boolean, description: 'Send its bill as a Stripe invoice on the 1st (default true)' }
        listPriceCents:
          type: object
          additionalProperties: false
          description: 'Monthly list price of one store of each size, in US cents (default 1200, 2400, 4800)'
          properties:
            small: { type: integer, minimum: 0, maximum: 1000000 }
            medium: { type: integer, minimum: 0, maximum: 1000000 }
            large: { type: integer, minimum: 0, maximum: 1000000 }
    Client:
      type: object
      additionalProperties: false
      required: [productId, name, email, size, status, tenantId, siteDomain, problem, invitationEmailed, dateCreated]
      properties:
        productId: { type: string, format: uuid, description: The client's own storefront }
        name: { type: string }
        email: { type: string }
        size: { type: string, enum: [small, medium, large] }
        status:
          type: string
          enum: [setting_up, invited, active, needs_attention]
          description: >-
            setting_up until the site is built; invited until the client accepts; active once they have;
            needs_attention when the storefront or site could not be built (see problem).
        tenantId: { type: string, format: uuid, nullable: true }
        siteDomain: { type: string, nullable: true }
        problem: { type: string, nullable: true }
        invitationEmailed: { type: boolean }
        dateCreated: { type: string, format: date-time }
    Reseller:
      type: object
      additionalProperties: false
      required: [id, name, maxProducts, maxTenants, wholesalePercent, billingEmail, brandName, brandUrl, listPriceCents, stripeCustomerId, autoInvoice, products, tenantCount, liveTenantCount, dateCreated]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        maxProducts: { type: integer, nullable: true }
        maxTenants: { type: integer, nullable: true }
        wholesalePercent: { type: integer }
        billingEmail: { type: string, nullable: true }
        brandName: { type: string, nullable: true }
        brandUrl: { type: string, nullable: true }
        stripeCustomerId: { type: string, nullable: true }
        autoInvoice: { type: boolean }
        listPriceCents:
          type: object
          additionalProperties: false
          required: [small, medium, large]
          properties:
            small: { type: integer }
            medium: { type: integer }
            large: { type: integer }
        products:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, tenantCount]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              tenantCount: { type: integer }
        tenantCount: { type: integer, description: 'Stores across its storefronts' }
        liveTenantCount: { type: integer, description: 'Stores counting toward its bill now' }
        dateCreated: { type: string, format: date-time }
    ResellerUsage:
      type: object
      additionalProperties: false
      required: [resellerId, from, to, wholesalePercent, storeDays, products]
      properties:
        resellerId: { type: string, format: uuid }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        wholesalePercent: { type: integer }
        storeDays: { $ref: '#/components/schemas/StoreDays' }
        products:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [productId, name, storeDays]
            properties:
              productId: { type: string, format: uuid }
              name: { type: string, nullable: true, description: 'null once the storefront is deleted' }
              storeDays: { $ref: '#/components/schemas/StoreDays' }
    ResellerBill:
      type: object
      additionalProperties: false
      required: [resellerId, resellerName, billingEmail, month, from, to, complete, currency, wholesalePercent, lines, totalCents]
      properties:
        resellerId: { type: string, format: uuid }
        resellerName: { type: string }
        billingEmail: { type: string, nullable: true }
        month: { type: string, description: 'YYYY-MM' }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        complete: { type: boolean, description: 'false while the month is not over yet' }
        currency: { type: string, enum: [usd] }
        wholesalePercent: { type: integer }
        lines:
          type: array
          description: One per storefront and store size
          items:
            type: object
            additionalProperties: false
            required: [productId, name, size, storeDays, stores, listPriceCents, wholesalePriceCents, amountCents]
            properties:
              productId: { type: string, format: uuid }
              name: { type: string, nullable: true, description: 'null once the storefront is deleted' }
              size: { type: string, enum: [small, medium, large] }
              storeDays: { type: number }
              stores: { type: number, description: 'Store-months: store-days over the days in the month' }
              listPriceCents: { type: integer }
              wholesalePriceCents: { type: integer, description: 'Monthly price of one store after the discount' }
              amountCents: { type: integer }
        totalCents: { type: integer }
    ResellerInvoice:
      type: object
      additionalProperties: false
      required: [id, month, totalCents, status, stripeInvoiceId, hostedInvoiceUrl, chargeAutomatically, error, dateCreated, dateUpdated]
      properties:
        id: { type: string, format: uuid }
        month: { type: string, description: 'YYYY-MM' }
        totalCents: { type: integer }
        status:
          type: string
          enum: [sending, nothing_due, open, paid, void, uncollectible, failed]
          description: >-
            open: Stripe has it, charging the card on file or emailed to pay. paid, void and
            uncollectible as Stripe reports. nothing_due: no charge that month. failed: see error.
        stripeInvoiceId: { type: string, nullable: true }
        hostedInvoiceUrl: { type: string, nullable: true, description: "Stripe's page to view and pay the invoice" }
        chargeAutomatically: { type: boolean, nullable: true, description: 'true: charged to the card on file; false: emailed to pay' }
        error: { type: string, nullable: true }
        dateCreated: { type: string, format: date-time }
        dateUpdated: { type: string, format: date-time }
    ResellerInvoices:
      type: object
      additionalProperties: false
      required: [enabled, invoices]
      properties:
        enabled: { type: boolean, description: 'false while automatic invoices are off' }
        invoices:
          type: array
          items: { $ref: '#/components/schemas/ResellerInvoice' }
    Error:
      type: object
      required: [statusCode, message]
      additionalProperties: false
      properties: { statusCode: { type: integer }, message: { type: string } }
    StatusCounts:
      type: object
      required: [pending, done, failed, removing]
      additionalProperties: false
      properties:
        pending: { type: integer }
        done: { type: integer }
        failed: { type: integer }
        removing: { type: integer }
    JobCounts:
      type: object
      required: [queued, running, failed]
      additionalProperties: false
      properties: { queued: { type: integer }, running: { type: integer }, failed: { type: integer } }
    Overview:
      type: object
      required: [health, tenants, versions, backups, jobs, products]
      additionalProperties: false
      properties:
        health:
          type: object
          required: [ok, database, queue, dbBackup, jobs, restoreTest, cpu]
          additionalProperties: false
          properties:
            ok: { type: boolean }
            database: { type: string, enum: [ok, down] }
            queue: { type: string, enum: [ok, down] }
            dbBackup: { $ref: '#/components/schemas/DbBackupStatus' }
            jobs:
              type: object
              description: >-
                Store and version jobs that failed their last retry in the last 24 hours and haven't
                been retried. ok is false while there are any. Never affects health.ok.
              required: [ok, failedLastDay]
              additionalProperties: false
              properties:
                ok: { type: boolean }
                failedLastDay: { type: integer }
            restoreTest:
              type: object
              description: >-
                The nightly restore test: one store's newest nightly backup restored into a throwaway
                copy, checked and deleted. ok is false when the last test failed, or tests are on and
                none passed in about two days while there are live stores. Never affects health.ok.
              required: [ok, status, lastPassedAt]
              additionalProperties: false
              properties:
                ok: { type: boolean }
                status: { type: string, enum: ['off', never, running, passed, failed] }
                lastPassedAt: { type: string, format: date-time, nullable: true }
            cpu:
              type: object
              description: >-
                The whole server's CPU over the last hour, from /proc/stat: busy and steal are shares of all
                cores, 0 to 1 (null until two samples are in). ok is false when busy passed CPU_WATCH_BUSY or
                steal passed CPU_WATCH_STEAL over a full window. status is 'off' with CPU_WATCH=off. Never
                affects health.ok.
              required: [ok]
              additionalProperties: false
              properties:
                ok: { type: boolean }
                status: { type: string, enum: ['off'] }
                busy: { type: number, nullable: true }
                steal: { type: number, nullable: true }
                minutes: { type: integer }
        tenants:
          type: object
          additionalProperties: false
          required: [pending, done, failed, removing, suspended]
          properties:
            pending: { type: integer }
            done: { type: integer }
            failed: { type: integer }
            removing: { type: integer }
            suspended: { type: integer }
        versions: { $ref: '#/components/schemas/StatusCounts' }
        backups: { $ref: '#/components/schemas/StatusCounts' }
        jobs: { $ref: '#/components/schemas/JobCounts' }
        products:
          type: array
          items:
            type: object
            required: [id, name, tenantCount]
            additionalProperties: false
            properties: { id: { type: string, format: uuid }, name: { type: string }, tenantCount: { type: integer } }
    DbBackupStatus:
      type: object
      description: >-
        The newest backup of the API's database to object storage. status off means the S3_*
        settings are not set; none, no backup yet; unknown, the status could not be read. stale is
        true when the newest success is more than 26 hours old. Never affects health.ok.
      required: [status, lastAttemptAt, lastSuccessAt, sizeBytes, stale]
      properties:
        status: { type: string, enum: [off, none, running, ok, failed, unknown] }
        lastAttemptAt: { type: string, format: date-time, nullable: true }
        lastSuccessAt: { type: string, format: date-time, nullable: true }
        sizeBytes: { type: integer, nullable: true, description: Size of the newest successful backup (encrypted) }
        stale: { type: boolean }
    DbBackup:
      type: object
      required: [id, status, startedAt, finishedAt, objectKey, sizeBytes, error, prunedAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [running, ok, failed] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        objectKey: { type: string, nullable: true, example: db-backups/2026/10/07/waas-20261007T023000Z.dump.enc }
        sizeBytes: { type: integer, nullable: true }
        error: { type: string, nullable: true }
        prunedAt: { type: string, format: date-time, nullable: true }
    RequestLogEntry:
      type: object
      additionalProperties: false
      required: [id, at, source, method, path, query, status, durationMs, productId, productName, apiKeyId, apiKeyLabel, userId, tenantId, tenantName, externalId, ip, userAgent, error]
      properties:
        id: { type: string, example: '1042' }
        at: { type: string, format: date-time }
        source: { type: string, enum: [v1, admin, account], description: 'account: a change a signed-in customer made from the dashboard.' }
        method: { type: string, example: POST }
        path: { type: string, example: /v1/tenants }
        query: { type: string, nullable: true, description: The query string without its '?'. }
        status: { type: integer }
        durationMs: { type: integer }
        productId: { type: string, format: uuid, nullable: true, description: Null for admin calls and failed sign-ins. }
        productName: { type: string, nullable: true }
        apiKeyId: { type: string, format: uuid, nullable: true }
        apiKeyLabel: { type: string, nullable: true, description: The key's label, when the key exists and has one. }
        userId: { type: string, format: uuid, nullable: true, description: The signed-in person who made the call, for calls made from the dashboard by a customer. }
        tenantId: { type: string, format: uuid, nullable: true, description: The store in the path or the tenantId parameter. }
        tenantName: { type: string, nullable: true, description: Null once the store is deleted, and at /account for a store that is not the product's. }
        externalId: { type: string, nullable: true, description: The externalId parameter, when given. }
        ip: { type: string, nullable: true }
        userAgent: { type: string, nullable: true }
        error: { type: string, nullable: true, description: The error message of a 4xx or 5xx response. }
    Page:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    TenantRow:
      type: object
      additionalProperties: false
      required: [id, externalId, name, productId, productName, versionId, versionName, mainDomain, domainCount, statusCode, statusName, size, isSuspended, latestBackupAt, dateCreated]
      properties:
        id: { type: string, format: uuid }
        externalId: { type: string }
        name: { type: string }
        productId: { type: string, format: uuid }
        productName: { type: string }
        versionId: { type: string, format: uuid }
        versionName: { type: string }
        mainDomain: { type: string, nullable: true }
        domainCount: { type: integer }
        statusCode: { type: integer, minimum: 0, maximum: 3 }
        statusName: { type: string }
        size: { type: string, enum: [small, medium, large] }
        isSuspended: { type: boolean }
        latestBackupAt: { type: string, format: date-time, nullable: true }
        dateCreated: { type: string, format: date-time }
    ImportCode:
      type: object
      additionalProperties: false
      required: [tenantId, externalId, importCode, pluginUrl]
      properties:
        tenantId: { type: string, format: uuid }
        externalId: { type: string }
        importCode: { type: string, description: Starts with AP1. }
        pluginUrl: { type: string, description: Downloads the AnyPress Export plugin. }
    TenantDetail:
      type: object
      additionalProperties: false
      required: [id, externalId, name, productId, productName, versionId, versionName, statusCode, statusName, size, keepsOwnCode, isSuspended, domains, backups, recentJobs, failures, wpOptionNames, phpConstantNames]
      properties:
        id: { type: string, format: uuid }
        externalId: { type: string }
        name: { type: string }
        productId: { type: string, format: uuid }
        productName: { type: string }
        versionId: { type: string, format: uuid }
        versionName: { type: string }
        snapshotName: { type: string }
        snapshotGroupName: { type: string, nullable: true }
        statusCode: { type: integer, minimum: 0, maximum: 3 }
        statusName: { type: string }
        size: { type: string, enum: [small, medium, large] }
        keepsOwnCode: { type: boolean, description: A site moved in from another host keeps its own plugins and themes; versions don't replace them. }
        moveIn:
          type: object
          description: Only for a store made to move a site in (docs/site-imports.md). It waits for the site while startedAt is null.
          additionalProperties: false
          required: [expiresAt, startedAt, source]
          properties:
            expiresAt: { type: string, format: date-time, description: When the import code stops working if the move hasn't started. }
            startedAt: { type: string, format: date-time, nullable: true }
            source:
              type: object
              nullable: true
              description: What the export plugin told about the old site.
              properties:
                home: { type: string }
                wordPressVersion: { type: string }
                phpVersion: { type: string }
                tablePrefix: { type: string }
                sizeBytes: { type: number }
                uploadedBytes: { type: number }
        emailUsage:
          type: object
          description: >-
            This calendar month's (UTC) emails as the platform counted them on toSend, from the store's own sender
            addresses (docs/store-email.md). Counted every hour when TOSEND_ADMIN_KEY is set; absent before the
            month's first count. The store goes by the higher of this and its own count.
          additionalProperties: false
          required: [month, sent, checkedAt]
          properties:
            month: { type: string, example: '2026-10' }
            sent: { type: integer, minimum: 0 }
            checkedAt: { type: string, format: date-time }
        isSuspended: { type: boolean }
        dateSuspended: { type: string, format: date-time, nullable: true }
        dateCreated: { type: string, format: date-time }
        dateChanged: { type: string, format: date-time }
        wpOptionNames: { type: array, items: { type: string }, description: Names only; values can be secret. }
        phpConstantNames: { type: array, items: { type: string }, description: Names only; values can be secret. }
        domains:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, domainName, isMainDomain, isBaseDomain]
            properties:
              id: { type: string, format: uuid }
              domainName: { type: string }
              isMainDomain: { type: boolean }
              isBaseDomain: { type: boolean }
        backups: { type: array, items: { $ref: '#/components/schemas/Backup' } }
        recentJobs: { type: array, items: { $ref: '#/components/schemas/Job' } }
        failures: { type: array, items: { $ref: '#/components/schemas/JobFailure' } }
    Backup:
      type: object
      additionalProperties: false
      required: [id, tenantId, externalId, productId, reason, sizeBytes, statusCode, statusName, dateCreated, tenantDeletedAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        externalId: { type: string }
        productId: { type: string, format: uuid }
        reason: { type: string, enum: [manual, suspend, scheduled, before-restore] }
        sizeBytes: { type: integer, nullable: true }
        statusCode: { type: integer, minimum: 0, maximum: 3 }
        statusName: { type: string }
        dateCreated: { type: string, format: date-time }
        tenantDeletedAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true, description: When the backup is purged; null while its tenant exists. }
    JobTarget:
      type: object
      required: [type, tenantId, versionId, backupId, baseSnapshotId]
      properties:
        type: { type: string, example: tenant.create }
        tenantId: { type: string, format: uuid, nullable: true }
        versionId: { type: string, format: uuid, nullable: true }
        backupId: { type: string, format: uuid, nullable: true }
        baseSnapshotId: { type: string, format: uuid, nullable: true }
    Job:
      allOf:
        - $ref: '#/components/schemas/JobTarget'
        - type: object
          required: [id, state, attempts, createdOn]
          properties:
            id: { type: string, format: uuid }
            state: { type: string, enum: [created, retry, active, completed, cancelled, failed] }
            attempts: { type: integer }
            createdOn: { type: string, format: date-time }
            startedOn: { type: string, format: date-time, nullable: true }
            startAfter: { type: string, format: date-time, nullable: true }
            completedOn: { type: string, format: date-time, nullable: true }
    JobFailure:
      allOf:
        - $ref: '#/components/schemas/JobTarget'
        - type: object
          required: [id, jobId, errorMessage, attempts, failedAt, status, retriedAt, retryJobId, dismissedAt]
          properties:
            id: { type: string, format: uuid }
            jobId: { type: string, format: uuid }
            errorMessage: { type: string }
            attempts: { type: integer }
            failedAt: { type: string, format: date-time }
            status: { type: string, enum: [failed, retried, dismissed] }
            retriedAt: { type: string, format: date-time, nullable: true }
            retryJobId: { type: string, format: uuid, nullable: true }
            dismissedAt: { type: string, format: date-time, nullable: true }
    PluginSlug: { type: string, enum: [wpcs-waas-host, wpcs-waas-client, waas-payments] }
    PluginInstall:
      type: object
      additionalProperties: false
      required: [productId, productName, slug, site, version, channel, wpVersion, phpVersion, firstSeen, lastSeen]
      properties:
        productId: { type: string, format: uuid }
        productName: { type: string }
        slug: { $ref: '#/components/schemas/PluginSlug' }
        site: { type: string, description: 'The site URL it reported; empty when it sent none' }
        version: { type: string }
        channel: { type: string, enum: [stable, beta] }
        wpVersion: { type: string, nullable: true }
        phpVersion: { type: string, nullable: true }
        firstSeen: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }
    PluginPin:
      type: object
      additionalProperties: false
      required: [productId, slug, version, pinnedAt]
      properties:
        productId: { type: string, format: uuid }
        slug: { $ref: '#/components/schemas/PluginSlug' }
        version: { type: string }
        pinnedAt: { type: string, format: date-time }
    WebhookEventType:
      type: string
      description: See openapi/webhooks.yaml.
      enum: [tenant.ready, tenant.updated, tenant.version_changed, tenant.domains_changed, tenant.suspended, tenant.resumed, tenant.deleted, tenant.restored, tenant.rolled_back, tenant.backup_completed, tenant.backup_failed, tenant.failed, version.ready, version.deleted, version.failed, webhook.test]
    WebhookEndpointParams:
      type: object
      properties:
        url: { type: string, example: 'https://hooks.example.com/waas' }
        description: { type: string, nullable: true, maxLength: 200 }
        eventTypes:
          description: Empty or left out is every event.
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }
        enabled: { type: boolean }
    WebhookEndpoint:
      type: object
      required: [id, url, description, eventTypes, enabled, dateCreated, dateChanged]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        description: { type: string, nullable: true }
        eventTypes:
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }
        enabled: { type: boolean }
        dateCreated: { type: string, format: date-time }
        dateChanged: { type: string, format: date-time }
    AdminWebhookEndpoint:
      allOf:
        - $ref: '#/components/schemas/WebhookEndpoint'
        - type: object
          required: [productId, productName, apiKeyId, last24Hours, pending, lastAttemptAt]
          properties:
            productId: { type: string, format: uuid }
            productName: { type: string }
            apiKeyId: { type: string, format: uuid, nullable: true, description: The API key that registered it; null when added here }
            last24Hours:
              type: object
              additionalProperties: false
              required: [sent, failed]
              properties:
                sent: { type: integer, description: Deliveries created in the last 24 hours }
                failed: { type: integer, description: Of those, how many failed after their retries }
            pending: { type: integer, description: Deliveries still being sent or retried }
            lastAttemptAt: { type: string, format: date-time, nullable: true }
    WebhookDelivery:
      type: object
      required: [id, eventId, eventType, endpointId, tenantId, versionId, status, attempts, responseStatus, responseBody, error, durationMs, dateCreated, lastAttemptAt]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        eventType: { $ref: '#/components/schemas/WebhookEventType' }
        endpointId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid, nullable: true }
        versionId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [pending, delivered, failed] }
        attempts: { type: integer }
        responseStatus: { type: integer, nullable: true }
        responseBody: { type: string, nullable: true }
        error: { type: string, nullable: true }
        durationMs: { type: integer, nullable: true }
        dateCreated: { type: string, format: date-time }
        lastAttemptAt: { type: string, format: date-time, nullable: true }
